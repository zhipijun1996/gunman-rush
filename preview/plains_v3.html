<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风铃平原精修 v3</title><style>body{margin:0;background:#1d302c;color:#fff0cc;font-family:system-ui}header{padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}button,select{font:inherit;background:#e6d2a0;border:2px solid #97703c;border-radius:8px;padding:8px;color:#302a20}canvas{display:block;width:min(100%,1600px);height:auto;margin:auto}p{padding:0 20px;font-size:14px}#sheets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}.tile{background:#31463f;border:1px solid #a18c55;padding:10px;border-radius:9px;text-align:center}.tile canvas{width:100%;background:#21332c}.tile label{display:block;padding:8px;font-size:13px}@media(max-width:800px){#sheets{grid-template-columns:repeat(2,1fr)}}</style><header><strong>风铃平原 · 精修独立素材合屏</strong><select id="mode"><option value="traverse">探索与移动平台</option><option value="boss">第十关 Boss 视觉</option><option value="reward">道具二选一 UI</option><option value="layered">独立视差层合屏</option></select><button id="shuffle">切换组装宽度</button><label>人物状态 <select id="state"><option>idle</option><option>run</option><option>jump</option><option>fall</option><option>recoil</option><option>death</option></select></label><label>瞄准 <input id="aim" type="range" min="-180" max="180" value="0"></label><button id="flip">人物朝向</button></header><canvas id="scene" width="1920" height="1080"></canvas><p>真实PNG与图集区域实时组装；预览不运行Godot或物理。平台落脚线、独立武器旋转、两类货币与六类出口分别展示。新资源尚待运行接入与真机验收。</p><section id="sheets"></section><script>
const C=document.getElementById('scene'),ctx=C.getContext('2d'),images={},sprites={};let variation=0,facing=1,heroMeta=null,start=performance.now();const load=async file=>{if(images[file])return images[file];let i=new Image;i.src='../'+file;await i.decode();return images[file]=i};
function sprite(id,x,y,h,anchor='bottom',rotate=0){let e=sprites[id];if(!e)return;let im=images[e.file],r=e.region,w=r[2]/r[3]*h;ctx.save();ctx.translate(x,y);ctx.rotate(rotate);ctx.drawImage(im,...r,-w/2,anchor==='center'?-h/2:-h,w,h);ctx.restore()}
function platform(x,y,w,h,wood=false){let file='assets/plains_v3/terrain/'+(wood?'brass_wood_bridge.png':'grass_limestone.png'),im=images[file],scale=.20,first=wood?19:47,last=wood?2153:2123,top=wood?265:263,stand=wood?289:322,bottom=wood?642:570;let cap=Math.min(45,w/2),dh=Math.min((bottom-top)*scale,h+(stand-top)*scale),dy=y-(stand-top)*scale;
if(!wood){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();let fill=images['assets/plains_v3/terrain/organic_cliff_fill.png'],tile=380;for(let yy=y;yy<y+h;yy+=tile)for(let xx=x;xx<x+w;xx+=tile){ctx.save();ctx.translate(xx,yy);let fx=Math.floor((xx-x)/tile)%2,fy=Math.floor((yy-y)/tile)%2;ctx.translate(fx?tile:0,fy?tile:0);ctx.scale(fx?-1:1,fy?-1:1);ctx.drawImage(fill,0,0,tile,tile);ctx.restore()}ctx.restore()}
ctx.drawImage(im,first,top,cap/scale,dh/scale,x,dy,cap,dh);let xx=x+cap,end=x+w-cap;while(xx<end-.01){let width=Math.min(160,end-xx);ctx.drawImage(im,680,top,width/scale,dh/scale,xx,dy,width,dh);xx+=width}ctx.drawImage(im,last-cap/scale,top,cap/scale,dh/scale,end,dy,cap,dh);ctx.strokeStyle='#dfd2a0';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke()}
function hero(x,y,t){if(!heroMeta)return;let state=document.getElementById('state').value,frames=heroMeta.frames.filter(e=>e.state===state);if(!frames.length)return;let frame=frames[frames[0].loop?Math.floor(t*frames[0].fps)%frames.length:Math.min(frames.length-1,Math.floor(t*frames[0].fps))];let r=frame.region,b=frame.alpha_bbox_px||frame.body_bounds_local;let file=frame.path||frame.texture;let im=images[file];if(!im)return;let sy=frame.pivot_px||frame.pivot_local,scale=85/heroMeta.reference_body_height;ctx.save();ctx.translate(x,y);ctx.scale(facing,1);ctx.drawImage(im,...r,-sy[0]*scale,-sy[1]*scale,r[2]*scale,r[3]*scale);ctx.restore();if(heroMeta.previewWeapon){let e=heroMeta.previewWeapon;let angle=Number(document.getElementById('aim').value)*Math.PI/180;ctx.save();ctx.translate(x+(frame.shoulder[0]-sy[0])*scale*facing,y+(frame.shoulder[1]-sy[1])*scale);ctx.rotate(angle);ctx.scale(1,Math.cos(angle)<0?-1:1);ctx.drawImage(images[e.file],...e.region,-e.pivot[0]*e.scale,-e.pivot[1]*e.scale,e.region[2]*e.scale,e.region[3]*e.scale);ctx.restore()}}
function hud(){ctx.fillStyle='#243b2de0';ctx.fillRect(22,22,540,98);ctx.strokeStyle='#d2b773';ctx.strokeRect(22,22,540,98);for(let i=0;i<5;i++)sprite(i<4?'heart_full':'heart_empty',55+i*43,55,30,'center');sprite('jump_diamond',305,52,29,'center');sprite('shot_arrows',365,52,29,'center');sprite('run_coin',421,52,28,'center');sprite('meta_note',490,52,29,'center');ctx.fillStyle='#fff1d0';ctx.font='20px system-ui';ctx.fillText('HP 4/5     跳跃 2  射击 3    金币 24  音符 8',39,97);ctx.textAlign='right';ctx.fillText('风铃平原  ·  '+(document.getElementById('mode').value==='boss'?'10 / 10':'01 / 10'),1880,52);ctx.textAlign='left'}
function draw(t){ctx.clearRect(0,0,C.width,C.height);ctx.filter='blur(1px) saturate(.82)';ctx.drawImage(images['assets/plains_v3/background.png'],0,0,1920,1080);ctx.filter='none';if(document.getElementById('mode').value==='layered'){for(const n of ['sky','hills','meadow'])ctx.drawImage(images['assets/plains_v3/background_layers/'+n+'.png'],0,0,1920,1080)}ctx.fillStyle='#dae8da1c';ctx.fillRect(0,0,1920,1080);let boss=document.getElementById('mode').value==='boss';if(boss){platform(0,875,1920,205);sprite('boss_phase_2',1380,875,300);hero(470,875,t);sprite('checkpoint',150,875,106);ctx.fillStyle='#253227e8';ctx.fillRect(1040,105,700,55);ctx.fillStyle='#b34231';ctx.fillRect(1055,119,520,23);ctx.fillStyle='#fff0c6';ctx.font='23px system-ui';ctx.fillText('钟械守卫 · 视觉状态参考',1057,172)}else{let w=variation%2?430:580;platform(0,810,w,270);platform(w+95,665,330,330);platform(w+520,545,230,28,true);platform(w+895,735,1920-w-895,345);sprite('windchime',110,810,220);sprite('flowers',370,810,52);sprite('checkpoint',480,810,92);hero(250,810,t);sprite('spring',w+210,665,60);sprite('saw',w+470,760,96,'center',t*.7);sprite('patrol_drone_body',w+580,400,65,'center');sprite('patrol_drone_rotor',w+580,355,25,'center',0);sprite('jump_refill',w+210,520,42,'center');sprite('shot_refill',w+700,415,40,'center');sprite('run_coin',w+310,535,30,'center');sprite('meta_note',w+380,480,38,'center');sprite('exit',1800,735,165);sprite('exit_item',1800,552,51,'center');sprite('chest',1640,735,76);sprite('healing',1530,690,46,'center')}
hud();if(document.getElementById('mode').value==='reward'){ctx.fillStyle='#142b25cc';ctx.fillRect(0,0,1920,1080);sprite('card_blue',740,885,650);sprite('card_purple',1180,885,650);ctx.textAlign='center';ctx.fillStyle='#fff0cc';ctx.font='32px system-ui';ctx.fillText('选择一件本局道具 · 样式预览',960,170);for(const [x,txt]of [[740,'蓝色道具'],[1180,'紫色道具']]){ctx.fillStyle='#362c23';ctx.font='29px system-ui';ctx.fillText(txt,x,465);ctx.font='21px system-ui';ctx.fillText('名称与实际效果由游戏服务提供',x,550);ctx.fillText('样片不定义新效果或数值',x,595);ctx.fillText('选择',x,740)}ctx.textAlign='left'}ctx.fillStyle='#183b29ab';ctx.fillRect(0,1023,1920,57);ctx.fillStyle='#fff0cc';ctx.font='22px system-ui';ctx.fillText('独立素材组装预览  ·  画风已认可  ·  不代表运行接入 / 碰撞 / 真机已验',30,1060)}
(async()=>{let catalog=await(await fetch('plains_v3_catalog.json')).json();for(let e of catalog)sprites[e.id]=e;let files=['assets/plains_v3/background_layers/sky.png','assets/plains_v3/background_layers/hills.png','assets/plains_v3/background_layers/meadow.png',...new Set(catalog.map(e=>e.file)),...['background.png','terrain/grass_limestone.png','terrain/brass_wood_bridge.png','terrain/organic_cliff_fill.png'].map(f=>'assets/plains_v3/'+f)];try{heroMeta=await(await fetch('../assets/plains_v3/hero/preview_manifest.json')).json();files.push(...new Set(heroMeta.frames.map(e=>e.path||e.texture)));if(heroMeta.previewWeapon)files.push(heroMeta.previewWeapon.file)}catch(e){heroMeta=null}await Promise.all([...new Set(files)].map(load));for(let e of catalog){let tile=document.createElement('div');tile.className='tile';let can=document.createElement('canvas');can.width=340;can.height=210;let ct=can.getContext('2d'),r=e.region,f=Math.min(300/r[2],175/r[3]);ct.drawImage(images[e.file],...r,(340-r[2]*f)/2,(210-r[3]*f)/2,r[2]*f,r[3]*f);let lab=document.createElement('label');lab.textContent=e.id;tile.append(can,lab);document.getElementById('sheets').append(tile)}window.previewReady=true;function tick(now){draw((now-start)/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick)})().catch(e=>{window.previewError=String(e)});document.getElementById('shuffle').onclick=()=>variation++;document.getElementById('flip').onclick=()=>facing*=-1;
</script></html>
