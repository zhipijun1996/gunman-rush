<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gunman Rush · 标题与家园样板</title><style>
*{box-sizing:border-box}body{margin:0;background:#172720;color:#fff3d9;font-family:system-ui}header{padding:12px 22px;background:#25362b;display:flex;gap:16px;align-items:center}button{cursor:pointer;font:inherit;color:#fff0cd;background:linear-gradient(#775631,#392e20);border:2px solid #bd9454;border-radius:9px;padding:10px 22px;box-shadow:0 3px 9px #0007}button:hover,button:focus-visible{outline:3px solid #efcc82;filter:brightness(1.15)}#scene{position:relative;width:min(100vw,1400px);aspect-ratio:1672/941;margin:auto;background:url('../assets/title_home/home_background.png') center/100% 100%;overflow:hidden}#title{position:absolute;inset:0;background:#10231844;display:flex;align-items:center;flex-direction:column;padding-top:4%}#logo{width:46%;filter:drop-shadow(0 8px 10px #0008)}#title nav{display:grid;gap:12px;width:240px;margin-top:20px}#title small{margin-top:22px;text-shadow:0 2px 3px black}#player{position:absolute;width:6%;height:13%;left:34%;top:47%;background:url('../assets/painterly_v2/character/idle.png') 0 0/400% 100%;filter:drop-shadow(0 4px 2px #0006)}.npc{position:absolute;top:48%;width:6%;height:12%;background-image:url('../assets/title_home/npcs.png');background-size:300% 100%;filter:drop-shadow(0 4px 2px #0005)}.tag{position:absolute;top:38%;transform:translateX(-50%);background:#26392dcc;border:1px solid #ddc491;border-radius:8px;padding:5px 10px;text-align:center;font-size:clamp(11px,1.4vw,19px)}.locked{opacity:.55;filter:grayscale(1)}#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#20392be6;padding:9px 18px;border:1px solid #bcaa74;border-radius:10px;white-space:nowrap}#panel{position:absolute;inset:16% 22%;background:#eee0bd;border:5px solid #a37a3f;border-radius:20px;box-shadow:0 10px 40px #0009;color:#3c3020;padding:24px;overflow:auto}#panel h2{margin-top:0}#panel button{margin:8px}#panel p{line-height:1.65}.hidden{display:none!important}#controls{position:absolute;bottom:9%;left:3%;display:flex;gap:10px}#interact{position:absolute;bottom:9%;right:3%}#status{position:absolute;top:14px;left:16px;background:#253b2cdd;padding:8px 14px;border-radius:8px}.note{padding:12px;text-align:center;font-size:13px;color:#cbd7c3}
</style><header><strong>标题 / 可操控家园美术样板</strong><button id="reset">标题</button><label><input id="unlock" type="checkbox">预览全部 NPC 解锁</label></header><main id="scene"><div id="home" class="hidden"><div id="status">风铃营地 · 安全家园</div><div class="tag" style="left:14%">衣装师 · 换人物</div><div class="tag" id="upgradeTag" style="left:47%">钟械师 · 尚未归来</div><div class="tag" id="achievementTag" style="left:73%">记录员 · 尚未归来</div><div class="tag" style="left:93%">出口 · 开始冒险</div><div class="npc" style="left:11%;background-position:0% 0"></div><div class="npc hidden" id="upgradeNpc" style="left:44%;background-position:50% 0"></div><div class="npc hidden" id="achievementNpc" style="left:70%;background-position:100% 0"></div><div id="player"></div><div id="hint">左右 / A D 移动 · 靠近后 E 对话 · Esc 关闭</div><div id="controls"><button id="left">◀</button><button id="right">▶</button></div><button id="interact">对话 / 出发</button></div><div id="title"><img id="logo" src="../assets/title_home/title_logo.png" alt="GUNMAN RUSH"><small>风铃平原 · 钟械童话美术方案</small><nav><button id="enter">进入家园</button><button id="settings">设置</button><button id="help">操作说明</button></nav><small>工作标题 · 中文副标题仅描述美术方案</small></div><section id="panel" class="hidden"></section></main><div class="note">资源与交互样板，非正式游戏。解锁、购买、人物配置与存档由游戏服务实现；这里不会提交交易或启动 Run。</div><script>
const $=id=>document.getElementById(id);let x=34,dir=0,last=0;const keys=new Set();const panel=$('panel');const stations=[{x:14,title:'衣装师 · 更换人物',body:'在此查看已解锁人物、基础能力与当前选择。未拥有的人物展示解锁条件。',items:['当前人物：钟械信使','其他人物：等待内容定义']},{x:47,title:'钟械师 · 永久升级',body:'展示独立永久货币、等级与下一等级收益。购买必须经过事务服务；局内金币不能在此默认兑换。',items:['永久升级内容待定义','余额 / 成本由 Meta 服务读取']},{x:73,title:'记录员 · 成就',body:'展示长期里程碑、进度和已完成记录。是否附带奖励尚未确定，不默认发币。',items:['成就列表由稳定 ID 定义','本页面不模拟持久化']},{x:93,title:'启程 · 风铃平原',body:'出口交互后发出开始冒险请求；由 App 创建新的 Run。此样板仅展示出发确认。',items:['首区：风铃平原','未实装地区不开放']}];
function show(title,body,items=[]){keys.clear();dir=0;panel.innerHTML='<h2>'+title+'</h2><p>'+body+'</p>'+items.map(t=>'<p>◆ '+t+'</p>').join('')+'<button id="closePanel">返回</button>';panel.classList.remove('hidden');$('closePanel').onclick=()=>panel.classList.add('hidden');}
$('enter').onclick=()=>{$('title').classList.add('hidden');$('home').classList.remove('hidden')};$('reset').onclick=()=>{panel.classList.add('hidden');$('title').classList.remove('hidden');$('home').classList.add('hidden');keys.clear()};$('settings').onclick=()=>show('设置','代码接入时保留音量、输入配置 Apply 与返回功能。这里仅展示面板样式。');$('help').onclick=()=>show('操作说明','家园：左右移动，靠近 NPC 后对话。冒险的跳跃、松手射击与返回确认沿用游戏输入契约。');
$('unlock').onchange=()=>{const yes=$('unlock').checked;['upgradeNpc','achievementNpc'].forEach(id=>$(id).classList.toggle('hidden',!yes));$('upgradeTag').textContent=yes?'钟械师 · 永久升级':'钟械师 · 尚未归来';$('achievementTag').textContent=yes?'记录员 · 成就':'记录员 · 尚未归来'};
function talk(){if(!panel.classList.contains('hidden')||!$('title').classList.contains('hidden'))return;const s=stations.find(s=>Math.abs(x+3-s.x)<8);if(!s)return;if((s.x===47||s.x===73)&&!$('unlock').checked){show('等待伙伴归来','此站尚未解锁。正式条件读取 UnlockDefinition；示意图不锁定通关次数或价格。');return}show(s.title,s.body,s.items)}$('interact').onclick=talk;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D','e','E','Escape'].includes(e.key))e.preventDefault();if(e.key==='Escape'){panel.classList.add('hidden');keys.clear()}else if(e.key.toLowerCase()==='e'){if(!e.repeat)talk()}else keys.add(e.key.toLowerCase())});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();dir=0});for(const [id,d]of [['left',-1],['right',1]]){$(id).onpointerdown=e=>{dir=d;e.target.setPointerCapture(e.pointerId)};$(id).onpointerup=$(id).onpointercancel=()=>dir=0}
function tick(t){let dt=Math.min((t-last)/1000,.05);last=t;if(panel.classList.contains('hidden')&&$('title').classList.contains('hidden')){let d=dir+(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);x=Math.max(3,Math.min(94,x+d*dt*16));$('player').style.left=x+'%';if(d)$('player').style.transform=d<0?'scaleX(-1)':'scaleX(1)'}requestAnimationFrame(tick)}requestAnimationFrame(tick);

(async()=>{const atlas=new Image();atlas.src='../assets/title_home/ui_atlas.png';await atlas.decode();const data=await (await fetch('../assets/title_home/ui_atlas.json')).json();function region(name){const [x,y,w,h]=data.regions[name].rect;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(atlas,x,y,w,h,0,0,w,h);return c.toDataURL()}const button=region('primary_button');document.querySelectorAll('#title nav button').forEach(b=>{b.style.backgroundImage='url('+button+')';b.style.backgroundSize='100% 100%';b.style.backgroundColor='transparent';b.style.border='0';b.style.color='#3b2b19';b.style.height='72px';b.style.fontWeight='700';b.style.boxShadow='none'});const hero=new Image();hero.src='../assets/painterly_v2/character/idle.png';await hero.decode();const hc=document.createElement('canvas');hc.width=367;hc.height=272;hc.getContext('2d').drawImage(hero,92,260,367,272,0,0,367,272);$('player').style.backgroundImage='url('+hc.toDataURL()+')';$('player').style.backgroundSize='100% 100%';$('player').style.width='11%';$('player').style.height='12%';$('player').style.top='48%';const ni=new Image();ni.src='../assets/title_home/npcs.png';await ni.decode();const nm=await(await fetch('../assets/title_home/npcs.json')).json();document.querySelectorAll('.npc').forEach((el,i)=>{const en=nm.entries[i],r=en.region,b=en.body_bounds_local,w=b[2]-b[0],h=b[3]-b[1],nc=document.createElement('canvas');nc.width=w;nc.height=h;nc.getContext('2d').drawImage(ni,r[0]+b[0],r[1]+b[1],w,h,0,0,w,h);el.style.backgroundImage='url('+nc.toDataURL()+')';el.style.backgroundSize='100% 100%';el.style.width=(w/h*12*941/1672)+'%';el.style.backgroundPosition='0 0'});window.assetsReady=true})().catch(e=>{window.assetError=String(e)});
</script>
