<script>let current=1;const descriptions={1:'P1：风蚀线描、半透明淡彩、修长种翼与开敞肋架。轻、疏、易逝；细线在运动和小屏下是风险。',2:'P2：织构水粉、厚草毯、悬垂叶片与受力缝补。亲切、可触、重心低；要防玩具感和过密缝线。',3:'P3：不透明切面水粉、斜撑建筑、刀片叶冠与四足风籽。明快、有方向感；要防低多边形渲染感。',4:'P4：手刻墨线、大片纸白、芦弓椭圆负形与朱红守路人。神秘而留有暖意；要防排线噪声和整体偏冷。'};function choose(n){current=n;document.querySelector('#screen').src=`p${n}-scene.png`;document.querySelector('#board').src=`p${n}-board.png`;document.querySelector('#sceneLink').href=`p${n}-scene.png`;document.querySelector('#boardLink').href=`p${n}-board.png`;document.querySelector('#desc').textContent=descriptions[n];document.querySelectorAll('#choices button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.id)===n));}document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>choose(Number(b.dataset.id)));document.querySelector('#art').onclick=()=>choose(current);document.querySelector('#reference').onclick=()=>document.querySelector('#screen').src='gameplay-reference.png';document.querySelector('#layout').onclick=()=>document.querySelector('#screen').src='layout-guide.png';choose(1);</script></html>
