name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check changed scope and quality declarations
        if: github.event_name == 'pull_request'
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_quality_diff.py --base "$QUALITY_BASE"
      - name: Install media verification dependencies
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 update
            sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: python3 -m pip install --disable-pip-version-check --retries 1 --timeout 20 -r tools/requirements_art.txt
        timeout-minutes: 2
      - run: python3 tools/harness.py --profile docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-docs
          path: build/verification/harness/
          if-no-files-found: warn
          retention-days: 7
