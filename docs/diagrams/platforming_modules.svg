oke="#73e3ce" stroke-dasharray="3 4"/><text x="96" y="143" fill="#9bb4c0" font-family="sans-serif" font-size="11">motion track</text><circle cx="180" cy="183" r="11" fill="#d35653"/><path d="M176 179 l8 8 m0 -8 l-8 8" stroke="#101c29" stroke-width="2"/><rect x="218" y="48" width="8" height="8" fill="#e6f1f4"/></g></g><g transform="translate(650,394)"><rect width="302" height="292" rx="12" fill="#182a39" stroke="#38596a"/><text x="16" y="29" fill="#73e3ce" font-family="monospace" font-size="15">square_loop</text><text x="16" y="51" fill="#9bb4c0" font-family="sans-serif" font-size="12">Square main loop / optional branch</text><g transform="translate(18,68)"><rect x="0" y="185" width="260" height="9" rx="2" fill="#688595"/><rect x="0" y="111" width="66" height="9" rx="2" fill="#688595"/><rect x="10" y="38" width="65" height="9" rx="2" fill="#688595"/><rect x="117" y="38" width="131" height="9" rx="2" fill="#688595"/><rect x="205" y="111" width="55" height="9" rx="2" fill="#688595"/><circle cx="10" cy="170" r="8" fill="#85dca4"/><text x="22" y="174" fill="#85dca4" font-family="sans-serif" font-size="11">IN</text><circle cx="205" cy="170" r="8" fill="#73e3ce"/><text x="217" y="174" fill="#73e3ce" font-family="sans-serif" font-size="11">OUT</text><polyline points="27,166 36,92 41,20 215,20 228,92 223,165" fill="none" stroke="#efd18e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><circle cx="135" cy="145" r="11" fill="#d35653"/><path d="M131 141 l8 8 m0 -8 l-8 8" stroke="#101c29" stroke-width="2"/><rect x="36" y="94" width="8" height="8" fill="#e6f1f4"/><path d="M83 24 L130 84 L196 24" fill="none" stroke="#ad95da" stroke-dasharray="5 4"/><text x="99" y="107" fill="#ad95da" font-family="sans-serif" font-size="10">OPTIONAL</text></g></g><g transform="translate(966,394)"><rect width="302" height="292" rx="12" fill="#182a39" stroke="#38596a"/><text x="16" y="29" fill="#73e3ce" font-family="monospace" font-size="15">boss_approach</text><text x="16" y="51" fill="#9bb4c0" font-family="sans-serif" font-size="12">Safe approach / fixed battle core</text><g transform="translate(18,68)"><rect x="0" y="164" width="260" height="9" rx="2" fill="#688595"/><circle cx="8" cy="148" r="8" fill="#85dca4"/><text x="20" y="152" fill="#85dca4" font-family="sans-serif" font-size="11">IN</text><polyline points="23,142 62,142 100,142" fill="none" stroke="#efd18e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="66" y="147" width="8" height="8" fill="#e6f1f4"/><rect x="111" y="55" width="145" height="109" fill="none" stroke="#efd18e" stroke-width="2"/><text x="135" y="87" fill="#efd18e" font-family="sans-serif" font-size="11">FIXED CORE</text><text x="134" y="109" fill="#9bb4c0" font-family="sans-serif" font-size="11">boss + dodge space</text><circle cx="181" cy="138" r="11" fill="#d35653"/><path d="M177 134 l8 8 m0 -8 l-8 8" stroke="#101c29" stroke-width="2"/></g></g><text x="26" y="732" fill="#9bb4c0" font-family="sans-serif" font-size="14">Green: entry  /  Teal: exit  /  White square: safe anchor  /  Gold: main route  /  Purple: optional path or shot</text></svg>