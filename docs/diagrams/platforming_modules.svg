<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">Original platforming module blueprints</title><desc id="desc">Eight original topology sketches. Green entry, teal exit, white safe anchor, red danger, gold main route. Design only, not physics verified.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#efd18e"/></marker></defs><rect width="1280" height="760" fill="#101c29"/><text x="26" y="35" fill="#e6f1f4" font-family="sans-serif" font-size="24">ORIGINAL PLATFORMING MODULES</text><text x="26" y="62" fill="#9bb4c0" font-family="sans-serif" font-size="15">Design sketches only. Coordinates are illustrative; no trajectory or collision verification.</text><g transform="translate(18,85)"><rect width="302" height="292" rx="12" fill="#182a39" stroke="#38596a"/><text x="16" y="29" fill="#73e3ce" font-family="monospace" font-size="15">safe_hub</text><text x="16" y="51" fill="#9bb4c0" font-family="sans-serif" font-size="12">Safe meeting / reward space</text><g transform="translate(18,68)"><rect x="0" y="165" width="260" height="9" rx="2" fill="#688595"/><rect x="90" y="100" width="70" height="9" rx="2" fill="#688595"/><circle cx="15" cy="151" r="8" fill="#85dca4"/><text x="27" y="155" fill="#85dca4" font-family="sans-serif" font-size="11">IN</text><circle cx="205" cy="151" r="8" fill="#73e3ce"/><text x="217" y="155" fill="#73e3ce" font-family="sans-serif" font-size="11">OUT</text><polyline points="30,145 85,145 170,145 205,145" fill="none" stroke="#efd18e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="71" y="148" width="8" height="8" fill="#e6f1f4"/><text x="104" y="85" fill="#efd18e" font-family="sans-serif" font-size="11">REWARD</text></g></g><g transform="translate(334,85)"><rect width="302" height="292" rx="12" fill="#182a39" stroke="#38596a"/><text x="16" y="29" fill="#73e3ce" font-family="monospace" font-size="15">stepped_crossing</text><text x="16" y="51" fill="#9bb4c0" font-family="sans-serif" font-size="12">Horizontal steps / clear landing</text><g transform="translate(18,68)"><rect x="0" y="160" width="53" height="9" rx="2" fill="#688595"/><rect x="72" y="132" width="44" height="9" rx="2" fill="#688595"/><rect x="136" y="102" width="44" height="9" rx="2" fill="#688595"/><rect x="203" y="132" width="57" height="9" rx="2" fill="#688595"/><circle cx="12" cy="144" r="8" fill="#85dca4"/><text x="24" y="148" fill="#85dca4" font-family="sans-serif" font-size="11">IN</text><circle cx="205" cy="117" r="8" fill="#73e3ce"/><text x="217" y="121" fill="#73e3ce" font-family="sans-serif" font-size="11">OUT</text><polyline points="22,140 90,111 155,81 224,113" fill="none" stroke="#efd18e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><circle cx="123" cy="178" r="11" fill="#d35653"/><path d="M119 174 l8 8 m0 -8 l-8 8" stroke="#101c29" stroke-width="2"/><rect x="217" y="115" width="8" height="8" fill="#e6f1f4"/></g></g><g transform="translate(650,85)"><rect width="302" height="292" rx="12" fill="#182a39" stroke="#38596a"/><text x="16" y="29" fill="#73e3ce" font-family="monospace" font-size="15">recoil_shaft</text><text x="16" y="51" fill="#9bb4c0" font-family="sans-serif" font-size="12">Vertical rise / downward shot</text><g transform="translate(18,68)"><rect x="30" y="180" width="210" height="9" rx="2" fill="#688595"/><rect x="37" y="133" width="70" height="9" rx="2" fill="#688595"/><rect x="145" y="84" width="70" height="9" rx="2" fill="#688595"/><rect x="75" y="30" width="125" height="9" rx="2" fill="#688595"/><circle cx="42" cy="165" r="8" fill="#85dca4"/><text x="54" y="169" fill="#85dca4" font-family="sans-serif" font-size="11">IN</text><circle cx="155" cy="15" r="8" fill="#73e3ce"/><text x="167" y="19" fill="#73e3ce" font-family="sans-serif" font-size="11">OUT</text><polyline points="65,163 73,115 162,65 149,10" fill=