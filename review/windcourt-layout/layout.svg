<text x="40" y="575" class="label">① 短登高：每块踏板承担一次攀升，准备岸接战场，删除重复叠板与西侧空跑。</text>
<text x="40" y="621" class="label">② 紧凑战场：三台同宽等距；三阶段地面长荆棘，碰刺回已达战台，胜利收刺。</text>
<text x="40" y="667" class="label">③ 战后高廊：停驻／弹跃／反冲到宽岸；失手有短承接台重新勾回，不另设底层横廊。</text>
<text x="40" y="713" class="label">④ 钟井末端：一个停驻环连接落地岸台；中段开关解锁短竖井，与P06双向往返。</text>
<text x="40" y="785" class="small">金线：主流程    青虚线：回中庭    金点：停驻环    青点：弹跃锚    红带：三阶段荆棘</text>
