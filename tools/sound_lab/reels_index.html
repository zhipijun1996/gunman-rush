<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>失序之钟 · 场景音效短片</title>
<style>

-size:12px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:12px;margin-top:14px}.choice{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:13px}.choice select{width:100%;font-size:14px;margin:8px 0}.choice textarea{width:100%;min-height:72px;resize:vertical;background:#102018;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:14px}.source-list{margin:14px 0;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;overflow-wrap:anywhere}summary{cursor:pointer}.source-list p{margin:8px 0}.notice{font-size:13px;color:var(--warn);margin:14px 0 8px}.identity{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.sticky{position:fixed;bottom:0;left:0;right:0;background:#102019f5;border-top:1px solid var(--line);padding:9px 12px;z-index:10}.sticky .row{max-width:1040px;margin:auto}.sticky button{font-size:13px}#status{font-size:12px;flex:1;min-width:120px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:480px){main{padding:12px 10px 112px}h1{font-size:25px}.candidate-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.candidate-grid button{min-height:48px}.screen video{max-height:none}.choices{grid-template-columns:1fr}.tabs button{flex:1;padding:7px 8px;font-size:14px}.screen-head{padding:9px 10px}.screen-controls{padding:9px 10px}.identity{font-size:10px}}
</style></head><body><main>
<div class="eyebrow">AUDIO DIRECTOR / SCENE REELS 03</div><h1>看一段，选声音</h1><p class="muted" style="font-size:13px">直接播放游戏场景短片，点击候选即可跳到对应片段；无需载入完整游戏。</p>
<nav class="row tabs" id="categories" aria-label="场景类别"></nav><div class="row clip-picker" id="clips" role="group" aria-label="选择场景短片"></div>
<section class="screen" aria-label="实际场景音效录屏"><div class="screen-head"><div class="row"><h2 id="clip-title">正在加载短片清单…</h2><span id="clip-category" class="muted" style="font-size:12px"></span></div><div id="audio-label" class="track"></div></div>
<video id="reel-video" controls playsinline preload="auto" aria-label="游戏场景短片播放器"></video>
<div class="screen-controls"><div class="row versions" id="versions" role="group" aria-label="视频音轨版本"></div><div class="candidate-grid" id="candidates" role="group" aria-label="候选片段"></div><div class="row" style="margin-top:8px"><label class="loop-label"><input id="loop-segment" type="checkbox" disabled>循环当前候选段</label><span id="segment-info" class="time-label">点击候选开始比较</span><a id="download-video" download>下载当前场景短片</a></div><p id="clip-notes" class="notes"></p></div></section>
<div class="row" style="justify-content:space-between;margin-top:16px"><h2>记下声音偏好</h2><small>可逐事件选择，也可全部否决</small></div><div class="choices" id="choices"></div>
<details class="source-list"><summary>本片段音效来源与许可</summary><div id="sources"></div></details>
<p class="notice">这是场景录屏试听，选项尚待你确认。画面和音轨以实际视频为准；页面不会额外叠加音乐。</p><p class="row" style="font-size:13px"><a id="interactive">进入完整互动工坊 ↗</a><a id="download-all" hidden download>下载全部对比短片</a></p><div id="identity" class="identity"></div>
</main><footer class="sticky"><div class="row"><button id="stop">停止播放</button><button id="export">导出选择</button><span id="status" role="status">正在载入…</span></div></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),video=$('reel-video');
const CATEGORY_NAMES={ui:'界面交互',pickup:'物品拾取',combat:'命中与受伤',weapons:'武器射击',mix:'原BGM混音'};
const EVENT_NAMES={click:'按钮点击',confirm:'确认',denied:'拒绝',coin:'金币拾取',heal:'生命恢复',reward:'普通奖励',enemy_hit:'命中敌人',enemy_hurt:'敌人受伤',hurt:'主角受伤'};
let data=null,currentClip=null,currentVersion=null,category=null,activeCandidate=null,choices={},epoch=0,deadline=null,frameRequest=null,internalSeek=null,sourceLoadError=null,knownMetadata=false,boundaryBusy=false,mediaGeneration=0,mediaObjectUrl=null;
const mediaCache=new Map();
window.REELS_STATS={ready:false,loops:0,starts:0,cancellations:0,mediaErrors:[],get state(){return {clip_id:currentClip?.id||null,version_id:currentVersion?.id||null,candidate_id:activeCandidate?.id||null,loop:$('loop-segment').checked,paused:video.paused,time:video.currentTime,duration:Number.isFinite(video.duration)?video.duration:null}}};
function message(text){$('status').textContent=text}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e}
function safeUrl(path){const u=new URL(path,location.href);if(u.origin!==location.origin||!['https:','http:'].includes(u.protocol))throw Error('短片与下载必须来自本站');return u}
function validText(value){return typeof value==='string'&&value.length>0}
function eventIds(clip){return [...new Set(clip.candidates.flatMap(c=>c.event_ids||[]))]}
function eventLabel(id){return data?.event_labels?.[id]||EVENT_NAMES[id]||id}
function versions(clip){return clip.versions?.length?clip.versions:[{id:'main',label:clip.audio_label||'原录屏音轨',video:clip.video,audio_mode:clip.audio_mode||'engine_mix',duration:clip.duration}]}
function audioLabel(version){const label={sfx_only:'仅场景音效 · 无 BGM',with_bgm:'场景音效 + BGM · 已录入视频',engine_mix:'原录屏音轨 · 以本片实际混音为准'}[version.audio_mode]||'原录屏音轨';return version.label||label}
function cancelTimers(){clearTimeout(deadline);deadline=null;if(frameRequest!==null&&video.cancelVideoFrameCallback)video.cancelVideoFrameCallback(frameRequest);frameRequest=null}
function cancelSegment(pause=true){epoch++;window.REELS_STATS.cancellations++;boundaryBusy=false;cancelTimers();internalSeek=null;activeCandidate=null;$('loop-segment').checked=false;$('loop-segment').disabled=true;if(pause)video.pause();renderCandidateState()}
function pauseAll(){cancelSegment(true);for(const media of document.querySelectorAll('video,audio'))media.pause();message('已停止播放，循环已取消')}
function renderCandidateState(){for(const b of document.querySelectorAll('[data-candidate]'))b.setAttribute('aria-pressed',String(activeCandidate?.id===b.dataset.candidate));$('segment-info').textContent=activeCandidate?activeCandidate.label+' · '+activeCandidate.start.toFixed(2)+'–'+activeCandidate.end.toFixed(2)+' 秒':'点击候选开始比较'}
function save(){if(!data)return;try{localStorage.setItem('audio-director-reels:'+data.version,JSON.stringify(choices))}catch{message('浏览器阻止保存，请及时导出选择')}}
function record(eventId,candidateId,note){const key=currentClip.id+'/'+eventId;const candidate=currentClip.candidates.find(c=>c.id===candidateId);choices[key]={clip_id:currentClip.id,event_id:eventId,candidate_id:candidateId||null,sound_candidate_id:candidate?(candidate.event_candidate_ids?.[eventId]||candidate.id):null,profile:candidate?.profile||null,video_version:currentVersion.id,event_ids:candidate?.event_ids||[eventId],source_ids:candidate?.source_ids||[],start:candidate?.start??null,end:candidate?.end??null,version:data.version,note:note??choices[key]?.note??'',updated_at:new Date().toISOString()};save()}
function validateManifest(j){if(!validText(j.version)||!validText(j.source_commit)||!Array.isArray(j.clips)||!j.clips.length)throw Error('短片清单缺少版本或实际视频');const ids=new Set();for(const c of j.clips){if(!validText(c.id)||ids.has(c.id)||!validText(c.title)||!Array.isArray(c.candidates)||!c.candidates.length)throw Error('短片ID/候选清单错误');ids.add(c.id);const vs=versions(c);if(!vs.length)throw Error('短片没有视频版本');const versionIds=new Set();for(const v of vs){if(!validText(v.id)||versionIds.has(v.id))throw Error('视频版本ID错误');versionIds.add(v.id);if(!validText(v.video)||!Number.isFinite(v.duration??c.duration)||(v.duration??c.duration)<=0)throw Error('视频路径或时长错误');safeUrl(v.video)}const candidates=new Set();for(const x of c.candidates){if(!validText(x.id)||candidates.has(x.id)||!validText(x.label)||!Array.isArray(x.event_ids)||!x.event_ids.length||!Number.isFinite(x.start)||!Number.isFinite(x.end)||x.start<0||x.end<=x.start||vs.some(v=>x.end>(v.duration??c.duration)+.08))throw Error('候选片段时间或事件ID错误');if(x.event_candidate_ids!==undefined&&(x.event_candidate_ids===null||typeof x.event_candidate_ids!=='object'||Array.isArray(x.event_candidate_ids)||Object.entries(x.event_candidate_ids).some(([eventId,candidateId])=>!x.event_ids.includes(eventId)||!validText(candidateId))))throw Error('逐事件音效ID映射错误');candidates.add(x.id)}}}
function renderPicker(){const root=$('clips');root.replaceChildren();for(const c of data.clips.filter(x=>category===null||(x.category||'场景')===category)){const b=node('button',c.title);b.dataset.clip=c.id;b.setAttribute('aria-pressed',String(c.id===currentClip?.id));b.onclick=()=>selectClip(c.id);root.append(b)}}
function renderVersions(){const root=$('versions');root.replaceChildren();for(const v of versions(currentClip)){const b=node('button',v.label||audioLabel(v));b.dataset.version=v.id;b.setAttribute('aria-pressed',String(v.id===currentVersion.id));b.onclick=()=>selectVersion(v.id);root.append(b)}root.hidden=versions(currentClip).length<=1}
function renderCandidates(){const root=$('candidates');root.replaceChildren();for(const c of currentClip.candidates){const b=node('button');b.dataset.candidate=c.id;b.append(node('span','▶ '+c.label));b.append(node('small',c.start.toFixed(1)+'–'+c.end.toFixed(1)+' 秒'));b.setAttribute('aria-pressed','false');b.onclick=()=>playCandidate(c.id);root.append(b)}renderCandidateState()}
function renderChoices(){const root=$('choices');root.replaceChildren();for(const id of eventIds(currentClip)){const key=currentClip.id+'/'+id,a=node('section',null,'choice');a.dataset.event=id;a.append(node('h3',eventLabel(id)));const select=node('select');select.setAttribute('aria-label',eventLabel(id)+' 候选选择');select.dataset.choiceEvent=id;select.append(new Option('尚未选择',''));for(const c of currentClip.candidates.filter(x=>x.event_ids.includes(id)))select.append(new Option(c.label,c.id));select.append(new Option('都不合适','reject_all'));select.value=choices[key]?.candidate_id||'';select.onchange=()=>{record(id,select.value);message('已记下 '+eventLabel(id)+' 的偏好')};const note=node('textarea');note.placeholder='例如：更喜欢方案2；命中有点尖，希望短一些';note.setAttribute('aria-label',eventLabel(id)+' 试听备注');note.value=choices[key]?.note||'';note.oninput=()=>record(id,select.value,note.value);a.append(select,note);root.append(a)}}
function renderSources(){const root=$('sources');root.replaceChildren();const ids=[...new Set(currentClip.candidates.flatMap(c=>c.source_ids||[]))];if(!ids.length)root.append(node('p','本片段来源见项目完整许可记录。'));for(const id of ids){const s=data.sources?.[id];if(!s){root.append(node('p',id+' · 详细许可见随附来源记录'));continue}const p=node('p',(s.author||'作者见记录')+' · '+(s.license||'许可见记录')+' · '+(s.original_filename||id)+' · '+(s.attribution_required===true?'需要署名':s.attribution_required===false?'无需署名':'署名/复用条件见记录')+' ');if(s.source_url){try{const u=new URL(s.source_url);if(['http:','https:'].includes(u.protocol)){const a=node('a','来源页面');a.href=u.href;a.target='_blank';a.rel='noopener';p.append(a)}}catch{}}root.append(p);if(s.commercial_conditions)root.append(node('p',s.commercial_conditions,'muted'))}}
function selectVersion(id){const v=versions(currentClip).find(x=>x.id===id);if(!v)return;cancelSegment(true);const load=++mediaGeneration;currentVersion=v;sourceLoadError=null;knownMetadata=false;video.removeAttribute('src');video.load();if(mediaObjectUrl){URL.revokeObjectURL(mediaObjectUrl);mediaObjectUrl=null}video.removeAttribute('poster');if(currentClip.poster)video.poster=safeUrl(currentClip.poster).href;const source=safeUrl(v.video).href;$('audio-label').textContent=audioLabel(v);$('download-video').href=source;$('download-video').download=safeUrl(v.video).pathname.split('/').pop()||'scene-reel.mp4';renderVersions();renderChoices();message('正在缓冲这一支短片…');if(!mediaCache.has(source)){const pending=fetch(source,{credentials:'same-origin'}).then(r=>{if(!r.ok||!r.headers.get('content-type')?.startsWith('video/'))throw Error('视频权限或格式异常，请使用当前账号打开网站');return r.blob()}).catch(error=>{mediaCache.delete(source);throw error});mediaCache.set(source,pending);if(mediaCache.size>4)mediaCache.delete(mediaCache.keys().next().value)}mediaCache.get(source).then(blob=>{if(load!==mediaGeneration)return;mediaObjectUrl=URL.createObjectURL(blob);video.src=mediaObjectUrl;video.load();if(!activeCandidate)message('短片已就绪，点击候选播放')}).catch(error=>{if(load!==mediaGeneration)return;sourceLoadError=error.message;cancelSegment(true);message(sourceLoadError+'；也可下载短片')})}

function selectClip(id){const c=data.clips.find(x=>x.id===id);if(!c)return;cancelSegment(true);currentClip=c;currentVersion=versions(c)[0];$('clip-title').textContent=c.title;$('clip-category').textContent=CATEGORY_NAMES[c.category]||c.category||'';$('clip-notes').textContent=Array.isArray(c.notes)?c.notes.join(' '):(c.notes||'');renderPicker();renderCandidates();renderSources();selectVersion(currentVersion.id)}
function waitForMetadata(token){if(sourceLoadError)return Promise.reject(Error(sourceLoadError));if(video.readyState>=1)return Promise.resolve();return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>finish(Error('视频元数据载入超时，请检查网络后重试')),20000);function finish(error){clearTimeout(timeout);video.removeEventListener('loadedmetadata',ok);video.removeEventListener('error',bad);if(error)reject(error);else resolve()}function ok(){finish(token===epoch?null:Error('播放请求已取消'))}function bad(){finish(Error('视频载入失败'))}video.addEventListener('loadedmetadata',ok,{once:true});video.addEventListener('error',bad,{once:true})})}
async function waitForSeekable(time,token){const until=Date.now()+20000;while(token===epoch){for(let i=0;i<video.seekable.length;i++)if(time>=video.seekable.start(i)-.025&&time<=video.seekable.end(i)+.025)return true;if(time<.025&&video.readyState>=2)return true;if(sourceLoadError)throw Error(sourceLoadError);if(Date.now()>until)throw Error('此片段尚未下载完成，请稍后重试或下载短片');message('正在载入所选片段…');await new Promise(resolve=>setTimeout(resolve,100))}return false}
function seekTo(time,token){if(token!==epoch)return Promise.resolve(false);internalSeek={time,token};if(Math.abs(video.currentTime-time)<.025&&!video.seeking){internalSeek=null;return Promise.resolve(true)}return new Promise((resolve,reject)=>{const timer=setTimeout(()=>finish(Error('视频跳转未完成，请重试')),5000);function finish(error){clearTimeout(timer);video.removeEventListener('seeked',done);video.removeEventListener('error',bad);if(internalSeek?.token===token)internalSeek=null;if(error)reject(error);else resolve(token===epoch)}function done(){finish(Math.abs(video.currentTime-time)>.15?Error('视频尚未缓冲到此片段，请稍后重试或下载短片'):null)}function bad(){finish(Error('视频跳转失败'))}video.addEventListener('seeked',done,{once:true});video.addEventListener('error',bad,{once:true});try{video.currentTime=time}catch(error){finish(error)}})}
async function playCandidate(id){const c=currentClip?.candidates.find(x=>x.id===id);if(!c)return;cancelSegment(true);const token=epoch;activeCandidate=c;$('loop-segment').disabled=false;$('loop-segment').checked=false;renderCandidateState();try{await waitForMetadata(token);if(token!==epoch)return;if(c.end>video.duration+.08)throw Error('候选时间超过实际视频长度');if(!await waitForSeekable(c.start,token)||token!==epoch)return;if(!await seekTo(c.start,token)||token!==epoch)return;video.dataset.playEpoch=String(token);await video.play();if(token!==epoch){if(video.dataset.playEpoch===String(token))video.pause();return}video.dataset.playEpoch=String(token);window.REELS_STATS.starts++;message(currentClip.title+' · '+c.label);watchBoundary(token)}catch(error){if(token===epoch){cancelSegment(true);message(error.name==='NotAllowedError'?'请点视频上的播放键开启声音，再选择候选。':error.message)}}}
function watchBoundary(token){cancelTimers();if(token!==epoch||!activeCandidate||video.paused)return;const check=()=>{if(token!==epoch||!activeCandidate||video.paused)return;if(video.currentTime>=activeCandidate.end-.015){endSegment(token);return}if(video.requestVideoFrameCallback)frameRequest=video.requestVideoFrameCallback(check)};if(video.requestVideoFrameCallback)frameRequest=video.requestVideoFrameCallback(check);const left=(activeCandidate.end-video.currentTime)/Math.max(.1,video.playbackRate);deadline=setTimeout(()=>{if(token!==epoch||!activeCandidate)return;if(video.currentTime>=activeCandidate.end-.04)endSegment(token);else watchBoundary(token)},Math.max(15,left*1000))}
async function endSegment(token){if(token!==epoch||!activeCandidate||boundaryBusy)return;boundaryBusy=true;cancelTimers();video.pause();if(!$('loop-segment').checked){message(activeCandidate.label+' 片段播放结束');boundaryBusy=false;return}const c=activeCandidate;try{if(!await seekTo(c.start,token)||token!==epoch||!$('loop-segment').checked)return;video.dataset.playEpoch=String(token);await video.play();if(token!==epoch)return;window.REELS_STATS.loops++;watchBoundary(token)}catch(error){if(token===epoch){cancelSegment(true);message('循环已停止：'+error.message)}}finally{if(token===epoch)boundaryBusy=false}}
video.addEventListener('loadedmetadata',()=>{knownMetadata=true;if(!Number.isFinite(video.duration)||video.duration<=0){sourceLoadError='视频时长无效';message(sourceLoadError);return}if(currentClip?.candidates.some(c=>c.end>video.duration+.08)){sourceLoadError='片段时间超过实际视频长度';message(sourceLoadError)}});
video.addEventListener('error',()=>{sourceLoadError='视频载入失败，请重试或下载当前场景短片';window.REELS_STATS.mediaErrors.push({clip:currentClip?.id,code:video.error?.code||null});cancelSegment(true);message(sourceLoadError)});
video.addEventListener('pause',cancelTimers);video.addEventListener('ratechange',()=>watchBoundary(epoch));video.addEventListener('playing',()=>{if(activeCandidate)watchBoundary(epoch)});
video.addEventListener('seeking',()=>{if(internalSeek?.token===epoch)return;if(activeCandidate)cancelSegment(false)});
video.addEventListener('ended',()=>{if(activeCandidate&&$('loop-segment').checked)endSegment(epoch);else cancelTimers()});
document.addEventListener('play',event=>{const media=event.target;if(!(media instanceof HTMLMediaElement))return;for(const other of document.querySelectorAll('video,audio'))if(other!==media)other.pause();if(media!==video)cancelSegment(true)},true);
$('loop-segment').onchange=()=>{if(activeCandidate&&!video.paused)watchBoundary(epoch)};$('stop').onclick=pauseAll;
$('export').onclick=()=>{if(!data)return;const payload={schema_version:1,task:'AUDIO-DIRECTOR-03',candidate_version:data.version,source_commit:data.source_commit,exported_at:new Date().toISOString(),choices:Object.values(choices).map(item=>{const clip=data.clips.find(c=>c.id===item.clip_id),candidate=clip?.candidates.find(c=>c.id===item.candidate_id);return {...item,profile:item.profile||candidate?.profile||null,sound_candidate_id:candidate?(candidate.event_candidate_ids?.[item.event_id]||candidate.id):null}})};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=node('a');a.href=u;a.download='audio-director-reel-choices.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAll()});window.addEventListener('pagehide',pauseAll);
fetch('reels.json').then(r=>{if(!r.ok)throw Error('短片清单加载失败');return r.json()}).then(j=>{validateManifest(j);data=j;try{const v=JSON.parse(localStorage.getItem('audio-director-reels:'+j.version)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))choices=v}catch{}for(const c of [...new Set(j.clips.map(x=>x.category||'场景'))]){const b=node('button',CATEGORY_NAMES[c]||c);b.dataset.category=c;b.setAttribute('aria-pressed','false');b.onclick=()=>{category=c;for(const other of document.querySelectorAll('[data-category]'))other.setAttribute('aria-pressed',String(other===b));const first=data.clips.find(x=>(x.category||'场景')===c);if(first)selectClip(first.id)};$('categories').append(b)}category=j.clips[0].category||'场景';const firstTab=$('categories').firstElementChild;if(firstTab)firstTab.setAttribute('aria-pressed','true');if(j.interactive_url){$('interactive').href=safeUrl(j.interactive_url).href;if(j.interactive_label)$('interactive').textContent=j.interactive_label}else $('interactive').hidden=true;if(j.download_url){$('download-all').href=safeUrl(j.download_url).href;$('download-all').hidden=false}$('identity').textContent=j.version+' · source '+j.source_commit.slice(0,12);selectClip(j.clips[0].id);window.REELS_STATS.ready=true;message('点击候选时刻即可播放并比较')}).catch(error=>{$('clip-title').textContent='短片暂不可用';message(error.message)});
</script></body></html>
