<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失序之钟 · 全世界空间初稿</title><style>*{box-sizing:border-box}body{margin:0;background:#101d24;color:#e9e7cf;font:15px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,button{background:#253b42;color:inherit;border:1px solid #6d8179;border-radius:6px;padding:10px;max-width:190px}canvas{width:100%;height:65vh;display:block;touch-action:none}aside{padding:16px;line-height:1.7}small{color:#b6c3b6}.pill{color:#ead297}h3{margin:0 0 8px}a{color:#e5cb8c}</style><header><b>全世界 · 空间初稿</b><select id="region"><option value="">全部16区</option></select><select id="layer"></select><input id="search" placeholder="房号或名称"><button id="fit">总览</button><button id="plus">＋</button><button id="minus">−</button></header><canvas id="map"></canvas><aside id="info"><h3>309房 · 409连接</h3>拖动／双指缩放，点房间看职责、尺寸、奖励及去向。<br><small>265房为尺寸坐标初稿；通道为待施工方案。交叉位置不自动连通，需审核上跨／下穿。室内独立层从上方切换。已有玩法未被本图修改。</small></aside><script>
const data=__DATA__;
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),reg=document.getElementById('region'),layer=document.getElementById('layer'),info=document.getElementById('info');let v={x:0,y:0,z:.01},selected=null,w=0,h=0;
for(const r of data.regions)reg.add(new Option(r.name,r.code));for(const l of new Set(Object.values(data.rooms).map(r=>r.layer)))layer.add(new Option(l==='world'?'连续世界层':l+' 独立室内层',l));layer.value='world';
const color=r=>data.regions.find(x=>x.code===r.region)?.color||'#aabbaa';const visible=()=>Object.values(data.rooms).filter(r=>r.layer===layer.value&&(!reg.value||r.region===reg.value));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fit(){const rs=visible();if(!rs.length)return;const x=Math.min(...rs.map(r=>r.origin[0])),y=Math.min(...rs.map(r=>r.origin[1])),xx=Math.max(...rs.map(r=>r.origin[0]+r.bounds[2])),yy=Math.max(...rs.map(r=>r.origin[1]+r.bounds[3]));v={x:(x+xx)/2,y:(y+yy)/2,z:Math.min((w-30)/(xx-x),(h-30)/(yy-y))};draw()}
function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#101d24';ctx.fillRect(0,0,w,h);ctx.translate(w/2,h/2);ctx.scale(v.z,v.z);ctx.translate(-v.x,-v.y);const rs=visible(),ids=new Set(rs.map(r=>r.id));
for(const c of Object.values(data.connections)){if(!ids.has(c.a.room)&&!ids.has(c.b.room))continue;const s=c.spatial_draft;if(!s||s.kind==='occluded_scene_transition')continue;ctx.beginPath();s.path.forEach((pt,i)=>i?ctx.lineTo(...pt):ctx.moveTo(...pt));ctx.lineWidth=Math.max(1/v.z,s.width);ctx.strokeStyle=s.kind==='interface_needs_review'?'#e98173':'#5d7474';ctx.stroke();if(v.z>.035)for(const x of s.grade_separation_candidates||[]){ctx.fillStyle='#e7b17c';ctx.fillRect(x.point[0]-36,x.point[1]-36,72,72)}}
for(const r of rs){ctx.fillStyle=color(r)+'55';ctx.strokeStyle=r.id===selected?'#fff2b4':color(r);ctx.lineWidth=(r.id===selected?3:1)/v.z;for(const [x,y,bw,bh]of r.spaces){ctx.fillRect(x+r.origin[0],y+r.origin[1],bw,bh);ctx.strokeRect(x+r.origin[0],y+r.origin[1],bw,bh)}const x=r.origin[0]+r.bounds[2]/2,y=r.origin[1]+r.bounds[3]/2;if(v.z>.035){ctx.textAlign='center';ctx.font=`${Math.max(70,10/v.z)}px system-ui`;ctx.fillStyle='#f1eeda';ctx.fillText((r.rest?'营 ':r.role.includes('boss')?'⚔ ':'')+r.id+' '+r.name,x,y);if(v.z>.1){ctx.font=`${11/v.z}px system-ui`;ctx.fillText(r.purpose,x,y+17/v.z)}}if(r.rest||r.role.includes('boss')||Object.values(data.rewards).some(t=>t.room===r.id)){ctx.fillStyle=r.role.includes('boss')?'#ec9b7c':'#e9cf8f';ctx.beginPath();ctx.arc(x,y-120,Math.max(36,2/v.z),0,7);ctx.fill()}}
if(!reg.value){for(const area of data.regions){const own=rs.filter(r=>r.region===area.code);if(!own.length)continue;const x=own.reduce((s,r)=>s+r.origin[0]+r.bounds[2]/2,0)/own.length,y=Math.min(...own.map(r=>r.origin[1]))-180;ctx.font=`${13/v.z}px system-ui`;ctx.textAlign='center';ctx.fillStyle=area.color;ctx.fillText(area.name,x,y)}}ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#9baea8';ctx.font='12px system-ui';ctx.fillText(`${rs.length} 房 · ${Math.round(v.z*100)}% · 初稿未验收`,12,h-12)}
function select(r){selected=r.id;const rewards=Object.entries(data.rewards).filter(([k,x])=>x.room===r.id);const links=Object.values(data.connections).filter(c=>c.a.room===r.id||c.b.room===r.id);info.innerHTML=`<h3>${esc(r.id+' '+r.name)}</h3><div>${esc(r.purpose)}</div><div class="pill">${r.rest?'休息站 · ':''}${esc(r.role)} · ${r.authored?'已有玩法':'待施工空间初稿'}</div><div>坐标 ${r.origin.join(', ')} · 尺寸 ${r.bounds.slice(2).join(' × ')}</div><div>奖励：${rewards.map(([k])=>esc(k)).join('、')||'无'}</div><div>房内能力路线：${Object.values(r.routes).map(t=>esc(t.from+' → '+t.to+' '+JSON.stringify(t.requires))).join('；')||'无额外房内锁'}</div><div>NPC：${Object.values(data.npcs).filter(n=>n.room_id===r.id).map(n=>esc(n.name||n.id)).join('、')||'无'}</div>`+links.map(c=>{const id=c.a.room===r.id?c.b.room:c.a.room;const s=c.spatial_draft;return `<p><button data-room="${esc(id)}">${esc(id+' '+data.rooms[id].name)}</button> ${esc(c.condition_text||'基础通行')}<br><small>${esc(c.id)} · ${s.kind==='occluded_scene_transition'?'遮挡换层':s.kind==='existing_seam'?'已有接缝':s.kind==='interface_needs_review'?'接口受阻待调整':`通道候选 ${s.length}单位`}${s.grade_separation_candidates?.length?' · 含分层交叉待审':''}</small></p>`}).join('');info.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>focus(data.rooms[b.dataset.room]));draw()}
function focus(r){layer.value=r.layer;reg.value='';v={x:r.origin[0]+r.bounds[2]/2,y:r.origin[1]+r.bounds[3]/2,z:Math.min(w/(r.bounds[2]+800),h/(r.bounds[3]+800))};select(r)}
new ResizeObserver(()=>{w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;fit()}).observe(canvas);reg.onchange=fit;layer.onchange=fit;document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>{v.z*=1.4;draw()};document.getElementById('minus').onclick=()=>{v.z/=1.4;draw()};document.getElementById('search').onchange=e=>{const q=e.target.value.toLowerCase();const r=Object.values(data.rooms).find(r=>(r.id+' '+r.name).toLowerCase().includes(q));if(r)focus(r)};
let points=new Map(),start=null;const xy=e=>{const b=canvas.getBoundingClientRect();return [e.clientX-b.x,e.clientY-b.y]};canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,xy(e));start={v:{...v},points:[...points.values()],moved:false}};canvas.onpointermove=e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,xy(e));const ps=[...points.values()];if(ps.length===2&&start.points.length===2){v.z=start.v.z*Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1])/Math.max(1,Math.hypot(start.points[0][0]-start.points[1][0],start.points[0][1]-start.points[1][1]));start.moved=true}else if(ps.length===1&&start.points.length===1){const dx=ps[0][0]-start.points[0][0],dy=ps[0][1]-start.points[0][1];start.moved||=Math.hypot(dx,dy)>5;v.x=start.v.x-dx/v.z;v.y=start.v.y-dy/v.z}draw()};canvas.onpointerup=e=>{if(start&&!start.moved&&start.points.length===1){const pt=xy(e),x=(pt[0]-w/2)/v.z+v.x,y=(pt[1]-h/2)/v.z+v.y;const r=visible().find(r=>r.spaces.some(([a,b,c,d])=>x>=a+r.origin[0]&&x<=a+r.origin[0]+c&&y>=b+r.origin[1]&&y<=b+r.origin[1]+d));if(r)select(r)}points.delete(e.pointerId);if(!points.size)start=null};canvas.onpointercancel=()=>{points.clear();start=null};canvas.onwheel=e=>{e.preventDefault();v.z*=Math.exp(-e.deltaY*.001);draw()};
</script></html>
