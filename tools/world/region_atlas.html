<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>失序之钟 · 世界区域初稿</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b21;color:#e8ebdf;font:15px/1.55 system-ui,sans-serif}header{padding:12px 14px 8px}h1{font-size:20px;margin:0}p{margin:8px 0;color:#c3d0cb}.muted{font-size:12px;color:#a6b9b5}.controls{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 9px}button,select,textarea{font:inherit;color:inherit;border:1px solid #516560;border-radius:8px;background:#22343b;padding:9px}button{cursor:pointer;min-height:42px}select{min-width:0;flex:1}#viewport{height:54svh;min-height:260px;background:#111b21;overflow:hidden;touch-action:none;border-block:1px solid #445453}#atlas{display:block;width:100%;height:100%;user-select:none}#viewport.hide-ports .port{display:none}#detail{padding:14px;max-width:960px;margin:auto}h2{font-size:20px;margin:0 0 6px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{font-size:14px}.edge{border-top:1px solid #34474b;padding:12px 0}.edge strong{color:#efcf96}.stage{font-size:13px;color:#a9d2be}details{border-top:1px solid #34474b;margin-top:16px;padding-top:12px}textarea{display:block;width:100%;min-height:85px;margin:10px 0}#notes{padding:0 14px 22px;max-width:960px;margin:auto}#notice{padding:0 14px 8px}button:focus-visible,select:focus-visible{outline:2px solid #ffe1a0}.route-seq{color:#efcf96;font-size:16px}a{color:#ecd19e}@media(min-width:900px){#viewport{height:70vh}header,.controls,#notice{max-width:1300px;margin:auto}}
</style></head><body>
<header><h1>失序之钟 · 世界区域初稿</h1><p class="muted">先审核区域体量、相邻关系和接口。内部房间留到下一步。双指缩放，单指拖动。</p></header>
<div class="controls"><select id="regions" aria-label="选择区域"><option value="">全部16区域</option></select><select id="routes" aria-label="查看阶段路线"><option value="">阶段路线</option></select></div>
<div class="controls"><button id="reset">整图</button><button id="plus" aria-label="放大">＋</button><button id="minus" aria-label="缩小">－</button><button id="ports" aria-pressed="true">接口：显示</button><button id="download">导出审核意见</button></div>
<div id="viewport"><!-- ATLAS --></div>
<div id="detail" aria-live="polite"></div>
<div id="notes"><details><summary>记录审核意见（保存在这台设备）</summary><p class="muted" id="note-label"></p><textarea id="note" placeholder="例如：工城应该向东扩；矿井与沼泽的接口往下移……"></textarea><span class="muted" id="saved">输入后自动保存；导出文件可交给 AI 修改。</span></details></div>
<script>
const data=/* DATA */;
const $=s=>document.querySelector(s),regions=Object.fromEntries(data.regions.map(r=>[r.id,r])),edges=data.interfaces;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const select=$('#regions'),routes=$('#routes'),svg=$('#atlas'),viewport=$('#viewport'),detail=$('#detail');
for(const r of data.regions)select.add(new Option(`${r.id} · ${r.name}`,r.id));for(const r of data.routes)routes.add(new Option(r.name,r.id));
let key='world',view=[40,0,2040,1510],start=null,moved=false;const original=[...view],pointers=new Map();let notes={};try{notes=JSON.parse(localStorage.getItem('region-atlas-review')||'{}')}catch{}
function setView(v){view=v;svg.setAttribute('viewBox',v.join(' '))}
function fit(ids){const points=ids.flatMap(id=>regions[id].outline.map(p=>p.map(v=>v/data.display_scale)));const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;setView([x-65,y-65,w+130,h+130])}
function highlight(ids=[],ports=[]){document.querySelectorAll('.region').forEach(el=>{el.classList.toggle('dim',ids.length>0&&!ids.includes(el.dataset.region));el.classList.toggle('selected',ids.includes(el.dataset.region))});document.querySelectorAll('.port').forEach(el=>el.classList.toggle('dim',ids.length>0&&!ports.includes(el.dataset.port)))}
function noteFor(id,label){key=id;$('#note-label').textContent=`当前记录：${label}`;$('#note').value=notes[key]||''}
function edgeText(e){return `<div class="edge"><strong>${esc(e.id)} · ${esc(e.name)}</strong><div>${esc(regions[e.a].name)} ↔ ${esc(regions[e.b].name)}</div><div class="stage">${esc(e.stage)}</div><p>${esc(e.purpose)}</p></div>`}
function overview(){select.value='';routes.value='';highlight();setView(original);detail.innerHTML='<h2>先看世界怎样组成</h2><p>工城是东部的大城市枢纽；矿井沿城市下方展开，并向西连接沼泽和沉水遗迹。高地、根系、水系、城市与供能地下层各有空间位置。</p><p>点选区域可查看邻区与接口；选择阶段路线可查看游历意图。接口的编号只属于这张区域审核图。</p><p class="muted">共享边界不代表处处可通。轮廓是区域空间预算，不是要填满的房间外墙。本版不更改游戏，不作为 App 关卡导入包。</p>';noteFor('world','整张世界区域图')}
function region(id,zoom=true){const r=regions[id];if(!r)return;select.value=id;routes.value='';const es=edges.filter(e=>e.a===id||e.b===id),ns=[...new Set(es.map(e=>e.a===id?e.b:e.a))];highlight([id,...ns],es.map(e=>e.id));if(zoom)fit([id]);detail.innerHTML=`<h2>${esc(r.name)} · ${esc(r.role)}</h2><p>${esc(r.purpose)}</p><p class="stage">${esc(r.landmark)}</p><p>邻区（点选切换）</p><div class="chips">${ns.map(n=>`<button data-neighbor="${n}">${esc(regions[n].name)}</button>`).join('')}</div><p class="muted">${es.length} 个计划接口 · ${ns.length} 个邻区</p>${es.map(edgeText).join('')}`;noteFor(id,r.name)}
function port(id){const e=edges.find(e=>e.id===id);if(!e)return;select.value='';routes.value='';highlight([e.a,e.b],[id]);fit([e.a,e.b]);detail.innerHTML=`<h2>两区接续</h2>${edgeText(e)}<div class="chips"><button data-neighbor="${e.a}">查看${esc(regions[e.a].name)}</button><button data-neighbor="${e.b}">查看${esc(regions[e.b].name)}</button></div><p class="muted">此处只确定接在哪一侧、为什么能通、何时开放；门口尺寸与房间接缝在下一步细化。</p>`;noteFor(id,e.name)}
function route(id){const r=data.routes.find(r=>r.id===id);if(!r){overview();return}select.value='';highlight([...new Set(r.regions)],r.interfaces);setView(original);detail.innerHTML=`<h2>${esc(r.name)}</h2><p class="route-seq">${r.regions.map(id=>esc(regions[id].name)).join(' → ')}</p><p>${esc(r.note)}</p><p class="muted">这是跨区游历意图，并非区内已经贯通的走法。区域内部仍需用分区、能力锁和回路落实；不能用区域连通性代替能力可达验证。</p>${r.interfaces.map(id=>edgeText(edges.find(e=>e.id===id))).join('')}`;noteFor('route:'+id,r.name)}
select.onchange=()=>select.value?region(select.value):overview();routes.onchange=()=>route(routes.value);$('#reset').onclick=overview;detail.onclick=e=>{const b=e.target.closest('[data-neighbor]');if(b)region(b.dataset.neighbor)};
$('#ports').onclick=()=>{const hide=viewport.classList.toggle('hide-ports');$('#ports').textContent=`接口：${hide?'隐藏':'显示'}`;$('#ports').setAttribute('aria-pressed',String(!hide))};
function zoom(f){const w=Math.max(160,Math.min(4200,view[2]*f)),ratio=w/view[2],h=view[3]*ratio;setView([view[0]+(view[2]-w)/2,view[1]+(view[3]-h)/2,w,h])}$('#plus').onclick=()=>zoom(.75);$('#minus').onclick=()=>zoom(1.333);
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.1:.9)},{passive:false});
function snapshot(){const ps=[...pointers.values()];return {view:[...view],mid:ps.length===2?[(ps[0][0]+ps[1][0])/2,(ps[0][1]+ps[1][1])/2]:ps[0],dist:ps.length===2?Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]):0,count:ps.length}}
viewport.onpointerdown=e=>{if(!pointers.size)moved=false;pointers.set(e.pointerId,[e.clientX,e.clientY]);start=snapshot();viewport.setPointerCapture(e.pointerId)};
viewport.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);const now=snapshot(),rect=viewport.getBoundingClientRect(),scale=Math.max(start.view[2]/rect.width,start.view[3]/rect.height),dx=now.mid[0]-start.mid[0],dy=now.mid[1]-start.mid[1];if(Math.hypot(dx,dy)>5||now.count>1)moved=true;let v=[start.view[0]-dx*scale,start.view[1]-dy*scale,start.view[2],start.view[3]];if(now.count===2&&start.dist>0){const f=Math.max(.15,Math.min(5,start.dist/Math.max(1,now.dist)));v=[v[0]+v[2]*(1-f)/2,v[1]+v[3]*(1-f)/2,v[2]*f,v[3]*f]}setView(v)};
function activate(el){const p=el?.closest('[data-port]'),r=el?.closest('[data-region]');if(p)port(p.dataset.port);else if(r)region(r.dataset.region)}
function end(e){const tap=e.type==='pointerup'&&!moved&&pointers.size===1;pointers.delete(e.pointerId);if(pointers.size)start=snapshot();else start=null;if(tap)activate(document.elementFromPoint(e.clientX,e.clientY))}viewport.onpointerup=end;viewport.onpointercancel=end;
svg.addEventListener('keydown',e=>{if(!['Enter',' '].includes(e.key))return;e.preventDefault();const p=e.target.closest('[data-port]'),r=e.target.closest('[data-region]');if(p)port(p.dataset.port);else if(r)region(r.dataset.region)});
$('#note').oninput=()=>{notes[key]=$('#note').value;try{localStorage.setItem('region-atlas-review',JSON.stringify(notes));$('#saved').textContent='已保存在这台设备。'}catch{$('#saved').textContent='浏览器不允许保存；请及时导出。'}};
$('#download').onclick=()=>{const blob=new Blob([JSON.stringify({type:'region-atlas-review',source_schema:data.schema,notes},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='world-region-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
overview();
</script></body></html>
