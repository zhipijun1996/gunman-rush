<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>平原实景超级全图</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#0d101e;color:#e5ddc6;font:14px system-ui;height:100dvh;display:grid;grid-template-rows:auto 1fr auto}header{padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:#1b2930}button,select,a.button{font:inherit;color:inherit;background:#2a3e46;border:1px solid #637775;border-radius:4px;padding:8px;text-decoration:none}select{max-width:200px}#stage{position:relative;overflow:hidden;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}footer{padding:8px;background:#1b2930;font-size:12px;line-height:1.5}#status{color:#acc6c5}a{color:#a9d1d8}#selected{margin-left:auto}#loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#e5ddc6}</style><header><strong>平原实景全图</strong><button id="fit">总览</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><select id="room"><option value="">定位房间…</option></select><button id="labels" aria-pressed="true">标注：开</button><button id="markers" aria-pressed="true">要素：开</button><a class="button" href="panorama-full.jpg" download>下载整张大图</a><a id="selected" hidden target="_blank">无敌试玩此房</a></header><main id="stage"><canvas aria-label="可拖动与双指缩放的实景全图"></canvas><div id="loading">正在加载全图…</div></main><footer><div id="role"></div><span id="status">拖动查看，双指缩放，双击放大；点击房间可定位。</span><br><span id="scope"></span>无HUD／重复主角；整房检查视口的背景取景与正式游玩镜头不同。<a href="../plains-doors/">返回门对审核</a></footer><script>
(async()=>{const data=await fetch('panorama.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest');return r.json()}),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),pick=document.querySelector('#room'),status=document.querySelector('#status'),link=document.querySelector('#selected');let scale=1,x=0,y=0,minScale=0,labels=true,markers=true,selected='',frame=0,initialized=false,drag=false,lastTap=0;const touches=new Map(),cache=new Map(),sets=data.levels.map(l=>new Set(l.tiles));const overview=new Image();overview.src='overview.jpg?v='+data.revision;overview.onload=()=>{document.querySelector('#loading').hidden=true;render()};document.querySelector('a[download]').href='panorama-full.jpg?v='+data.revision;document.querySelector('a[download]').textContent='下载原图（'+Math.round(data.full_jpeg_bytes/1048576)+'MB）';document.querySelector('#scope').textContent=data.rooms.filter(r=>r.component===data.main_component).length+'间连续房按真实坐标拼接；独立室内层在右侧。'+data.rooms.filter(r=>r.preview).length+'间外区为入口示例。';const ordered=[...data.rooms].sort((a,b)=>(a.id.startsWith('P-')?0:1)-(b.id.startsWith('P-')?0:1)||a.id.localeCompare(b.id));for(const r of ordered){const o=document.createElement('option');o.value=r.id;o.textContent=r.id+' '+r.name+(r.preview?'（示例）':'');pick.append(o)}function resize(){const box=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);minScale=Math.min(box.width/data.width,box.height/data.height)*.96;if(!initialized){initialized=true;fit()}else{scale=Math.max(minScale,scale);render()}}function fit(){scale=minScale;x=(stage.clientWidth-data.width*scale)/2;y=(stage.clientHeight-data.height*scale)/2;render()}function zoom(mult,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const next=Math.max(minScale,Math.min(4,scale*mult));x=cx-(cx-x)*next/scale;y=cy-(cy-y)*next/scale;scale=next;render()}function render(){if(!frame)frame=requestAnimationFrame(draw)}function tile(z,cx,cy){const key=z+'/'+cx+'-'+cy;let entry=cache.get(key);if(entry){entry.used=performance.now();return entry.image}const image=new Image();entry={image,used:performance.now()};cache.set(key,entry);image.onload=render;image.onerror=()=>{entry.failed=true};image.src='tiles/'+key+'.webp?v='+data.revision;if(cache.size>48){const old=[...cache.entries()].sort((a,b)=>a[1].used-b[1].used);for(const [k,e] of old.slice(0,cache.size-48)){e.image.onload=null;cache.delete(k)}}return image}function draw(){frame=0;const w=stage.clientWidth,h=stage.clientHeight;ctx.fillStyle=data.background;ctx.fillRect(0,0,w,h);ctx.imageSmoothingEnabled=false;if(overview.complete&&overview.naturalWidth)ctx.drawImage(overview,x,y,data.width*scale,data.height*scale);const dpr=Math.min(devicePixelRatio||1,2),z=Math.max(0,Math.min(data.max_z,Math.ceil(data.max_z+Math.log2(scale*dpr)))),level=data.levels[z],unit=data.tile_size*level.factor*scale;const x0=Math.max(0,Math.floor(-x/unit)),y0=Math.max(0,Math.floor(-y/unit)),x1=Math.min(Math.ceil(level.width/data.tile_size)-1,Math.floor((w-x)/unit)),y1=Math.min(Math.ceil(level.height/data.tile_size)-1,Math.floor((h-y)/unit));for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){if(!sets[z].has(cx+'-'+cy))continue;const im=tile(z,cx,cy);if(im.complete&&im.naturalWidth)ctx.drawImage(im,x+cx*unit,y+cy*unit,im.naturalWidth*level.factor*scale,im.naturalHeight*level.factor*scale)}for(const r of data.rooms){const [bx,by,bw,bh]=r.box;if(selected===r.id){ctx.strokeStyle='#efc577';ctx.lineWidth=2;ctx.beginPath();r.polygon.forEach((p,i)=>i?ctx.lineTo(x+p[0]*scale,y+p[1]*scale):ctx.moveTo(x+p[0]*scale,y+p[1]*scale));ctx.closePath();ctx.stroke()}if(!labels||scale<.035||bw*scale<65||bh*scale<22)continue;const tx=x+r.center[0]*scale,ty=y+r.center[1]*scale;if(tx<0||ty<0||tx>w||ty>h)continue;let text=r.id+' '+r.name;ctx.font='12px system-ui';ctx.textAlign='center';if(ctx.measureText(text).width>bw*scale-8)text=r.id;const tw=ctx.measureText(text).width;ctx.fillStyle='rgba(13,16,30,.78)';ctx.fillRect(tx-tw/2-4,ty-14,tw+8,19);ctx.fillStyle=r.preview?'#9ed8d8':'#eee2bd';ctx.fillText(text,tx,ty);if(bw*scale>160&&bh*scale>55&&r.purpose){const line=r.purpose.slice(0,24);ctx.font='11px system-ui';const rw=ctx.measureText(line).width;ctx.fillStyle='rgba(13,16,30,.78)';ctx.fillRect(tx-rw/2-4,ty+5,rw+8,18);ctx.fillStyle='#b9c7bc';ctx.fillText(line,tx,ty+18)}}if(markers)for(const r of data.rooms)for(const m of r.markers||[]){const mx=x+(r.at[0]+m.point[0])*scale,my=y+(r.at[1]+m.point[1])*scale;if(mx<0||my<0||mx>w||my>h)continue;ctx.fillStyle={boss:'#f08d80',rest:'#8fd6c2',reward:'#eed081',chest:'#d6a86f',clock:'#b8b7ee'}[m.kind];ctx.beginPath();ctx.arc(mx,my,scale>.1?3.5:2,0,Math.PI*2);ctx.fill();if(scale>.1){ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText({boss:'Boss',rest:'休息',reward:'收集',chest:'宝箱',clock:'钟'}[m.kind],mx+5,my-4)}}status.textContent=(selected?selected+' · ':'')+data.rooms.length+'间房 · '+data.width+' × '+data.height+' · '+Math.round(scale*100)+'% · 拖动／双指缩放';window.PANORAMA_STATE={scale,x,y,selected,tileCache:cache.size,level:z};window.PANORAMA_READY=true}function select(id,focus){selected=id;pick.value=id;history.replaceState(null,'',id?'#'+id:location.pathname);const r=data.rooms.find(r=>r.id===id);link.hidden=!r;document.querySelector('#role').textContent=r?r.id+' '+r.name+'：'+r.purpose:'';if(r){link.href='../../?v='+data.game_build+'&review='+r.id+'&entry='+encodeURIComponent(r.entry)+'&stage=base&invincible=1';if(focus){const [bx,by,bw,bh]=r.box;scale=Math.min(2,Math.max(minScale,Math.min((stage.clientWidth-36)/bw,(stage.clientHeight-36)/bh)));x=(stage.clientWidth-bw*scale)/2-bx*scale;y=(stage.clientHeight-bh*scale)/2-by*scale}}render()}function inside(px,py,poly){let yes=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>py)!=(b[1]>py)&&px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1])+a[0])yes=!yes}return yes}function point(e){const b=canvas.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}let previous=null,start=null;canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e);touches.set(e.pointerId,p);start=p;previous=[...touches.values()];drag=false});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const p=point(e);touches.set(e.pointerId,p);const current=[...touches.values()];if(previous&&current.length===1&&previous.length===1){const dx=current[0].x-previous[0].x,dy=current[0].y-previous[0].y;x+=dx;y+=dy;if(start&&Math.hypot(p.x-start.x,p.y-start.y)>8)drag=true}else if(previous&&current.length===2&&previous.length===2){const a=current[0],b=current[1],aa=previous[0],bb=previous[1],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,oldx=(aa.x+bb.x)/2,oldy=(aa.y+bb.y)/2;zoom(Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,Math.hypot(aa.x-bb.x,aa.y-bb.y)),oldx,oldy);x+=cx-oldx;y+=cy-oldy;drag=true}previous=current;render()});function release(e){const p=point(e),count=touches.size;touches.delete(e.pointerId);previous=[...touches.values()];if(!drag&&count===1&&e.type==='pointerup'){const now=performance.now();if(now-lastTap<320){zoom(2,p.x,p.y);lastTap=0}else{lastTap=now;const hit=data.rooms.find(r=>inside((p.x-x)/scale,(p.y-y)/scale,r.polygon));select(hit?hit.id:'',false)}}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);previous=[...touches.values()];drag=true});canvas.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(Math.exp(-e.deltaY*.002),p.x,p.y)},{passive:false});document.querySelector('#fit').onclick=()=>{select('',false);fit()};document.querySelector('#plus').onclick=()=>zoom(1.6);document.querySelector('#minus').onclick=()=>zoom(1/1.6);document.querySelector('#labels').onclick=e=>{labels=!labels;e.target.textContent='标注：'+(labels?'开':'关');e.target.setAttribute('aria-pressed',labels);render()};document.querySelector('#markers').onclick=e=>{markers=!markers;e.target.textContent='要素：'+(markers?'开':'关');e.target.setAttribute('aria-pressed',markers);render()};pick.onchange=()=>select(pick.value,true);new ResizeObserver(resize).observe(stage);resize();if(data.rooms.some(r=>r.id===location.hash.slice(1)))select(location.hash.slice(1),true);window.PANORAMA_DATA={roomCount:data.rooms.length,width:data.width,height:data.height,fullBytes:data.full_jpeg_bytes};})().catch(e=>{document.querySelector('#loading').textContent='全图加载失败，请刷新重试';console.error(e)});
</script></html>
