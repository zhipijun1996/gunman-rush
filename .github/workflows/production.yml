name: Production impact

# Cloud worklines run Development locally. Only PRs run automatic Integration;
# avoiding push+PR duplicates does not depend on API races or branch naming.
# Main and explicit release keep the original environment.yml release gates.
on:
  pull_request:
    # Drafts already run these same exact-SHA checks. Marking a tested draft
    # ready changes no source and must not launch another expensive full run.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      stage:
        description: Scope (release remains in Godot core / tools/deliver.py)
        type: choice
        options: [development, integration]
        default: development
      base:
        description: Actual comparison base commit or ref
        type: string
        default: origin/main

permissions:
  contents: read

concurrency:
  group: production-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PRODUCTION_STAGE: ${{ github.event_name == 'pull_request' && 'integration' || inputs.stage }}
      PRODUCTION_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/docs/evidence/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements_art.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the existing external toolchain location
        run: echo "GUNMAN_TOOLCHAIN_ROOT=$RUNNER_TEMP/gunman-toolchains" >> "$GITHUB_ENV"
      - name: Exercise selection positive and negative cases
        run: |
          mkdir -p build/verification/production-ci
          python3 tests/test_production_plan.py 2>&1 | tee build/verification/production-ci/selector-tests.log
      - name: Plan actual changed paths before installing an engine
        id: impact
        run: |
          python3 tools/production_plan.py --base "$PRODUCTION_BASE" --stage "$PRODUCTION_STAGE" --plan --jobs 2 --output build/verification/production-ci/plan.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path('build/verification/production-ci/plan.json').read_text())
          manifest = json.loads(Path('tools/harness/profiles.json').read_text())
          checks = set(plan['checks'])
          needs_engine = bool(checks - set(manifest['profiles']['docs']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('needs_engine=' + str(needs_engine).lower() + '\n')
              output.write('needs_web=' + str('web-build' in checks).lower() + '\n')
          PY
      - name: Materialize selected original inputs without checking out all historical media
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          plan = json.loads(Path('build/verification/production-ci/plan.json').read_text())
          command = [sys.executable, 'tools/cloud_inputs.py', '--materialize', '--output',
                     'build/verification/production-ci/inputs.json']
          for check in plan['checks']:
              command.extend(['--check', check])
          with Path('build/verification/production-ci/inputs.log').open('w') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          if result.returncode:
              print(Path('build/verification/production-ci/inputs.log').read_text())
          raise SystemExit(result.returncode)
          PY
      - name: Fail fast on selected portable Python subchecks before engine or Foundry work
        run: python3 tools/production_plan.py --base "$PRODUCTION_BASE" --stage "$PRODUCTION_STAGE" --precheck-only --jobs 2 --output build/verification/production-ci/prechecks-plan.json 2>&1 | tee build/verification/production-ci/prechecks.log
      - name: Validate PR quality and guard changes against its actual base
        if: github.event_name == 'pull_request'
        run: python3 tools/check_quality_diff.py --base "$PRODUCTION_BASE" 2>&1 | tee build/verification/production-ci/quality-diff.log
      - name: Install media dependencies required by existing docs and readers
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              if [ -f "$apt_source" ]; then sudo sed -i -E ':azure_mirror; s#(^|[[:space:]])https?://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)#\1https://archive.ubuntu.com/ubuntu\2#g; t azure_mirror' "$apt_source"; fi
            done
            sudo apt-get -o Acquire::Retries=1 update 2>&1 | tee build/verification/production-ci/media-install.log
            sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg 2>&1 | tee -a build/verification/production-ci/media-install.log
          fi
          python3 -m pip install --disable-pip-version-check --retries 1 --timeout 20 -r tools/requirements_art.txt 2>&1 | tee build/verification/production-ci/python-install.log
      - uses: actions/cache/restore@v4
        if: steps.impact.outputs.needs_engine == 'true'
        id: toolchain
        with:
          path: |
            ${{ runner.temp }}/gunman-toolchains/godot
            ${{ runner.temp }}/gunman-toolchains/user-data/godot/export_templates
          key: godot-standard-4.7.2-v2-${{ runner.os }}-${{ hashFiles('config/toolchain.json', 'tools/setup_environment.py') }}
      - name: Install and verify the repository locked Standard engine and templates
        if: steps.impact.outputs.needs_engine == 'true'
        timeout-minutes: 15
        run: |
          bash tools/cloud_setup.sh --godot-only 2>&1 | tee build/verification/production-ci/toolchain.log
          if ! command -v Xvfb >/dev/null; then
            for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              if [ -f "$apt_source" ]; then sudo sed -i -E ':azure_mirror; s#(^|[[:space:]])https?://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)#\1https://archive.ubuntu.com/ubuntu\2#g; t azure_mirror' "$apt_source"; fi
            done
            sudo apt-get -o Acquire::Retries=1 update 2>&1 | tee build/verification/production-ci/display-install.log
            sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends xvfb xauth 2>&1 | tee -a build/verification/production-ci/display-install.log
          fi
      - uses: actions/cache/save@v4
        if: success() && steps.impact.outputs.needs_engine == 'true' && steps.toolchain.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/gunman-toolchains/godot
            ${{ runner.temp }}/gunman-toolchains/user-data/godot/export_templates
          key: godot-standard-4.7.2-v2-${{ runner.os }}-${{ hashFiles('config/toolchain.json', 'tools/setup_environment.py') }}
      - name: Prepare the existing validated Foundry export dependency when needed
        if: steps.impact.outputs.needs_web == 'true'
        timeout-minutes: 15
        run: |
          python3 tools/check_release_evidence.py --commit "$(git rev-parse HEAD)" 2>&1 | tee build/verification/production-ci/release-evidence.log
          python3 tools/foundry.py build --count 24 --promote 2>&1 | tee build/verification/production-ci/foundry-build.log
          bash tools/godot.sh --headless --path . --script tools/foundry_export_stamp.gd 2>&1 | tee build/verification/production-ci/foundry-stamp.log
      - name: Freeze the prepared execution plan and restore all its selected inputs
        run: |
          # Re-plan after the original export preparation: its real resource
          # changes remain visible and may conservatively upgrade to full.
          python3 tools/production_plan.py --base "$PRODUCTION_BASE" --stage "$PRODUCTION_STAGE" --plan --jobs 2 --output build/verification/production-ci/pre-execution-plan.json
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          plan = json.loads(Path('build/verification/production-ci/pre-execution-plan.json').read_text())
          command = [sys.executable, 'tools/cloud_inputs.py', '--materialize', '--output',
                     'build/verification/production-ci/pre-execution-inputs.json']
          for check in plan['checks']:
              command.extend(['--check', check])
          with Path('build/verification/production-ci/pre-execution-inputs.log').open('w') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          if result.returncode:
              print(Path('build/verification/production-ci/pre-execution-inputs.log').read_text())
          raise SystemExit(result.returncode)
          PY
      - name: Choose only exact full-profile work for physical lanes
        id: route
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          plan=json.loads(Path('build/verification/production-ci/pre-execution-plan.json').read_text())
          manifest=json.loads(Path('tools/harness/profiles.json').read_text())
          if plan['ci_route']=='full_lanes' and set(plan['checks'])!=set(manifest['profiles']['full']):
              raise SystemExit('Full lane routing requires the exact original full check set')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ci_route='+plan['ci_route']+'\n')
          print('Selected route:',plan['ci_route'],'checks:',len(plan['checks']))
          PYCODE
      - name: Execute affected checks without upgrading them to full or Web
        if: steps.route.outputs.ci_route != 'full_lanes'
        run: python3 tools/production_plan.py --base "$PRODUCTION_BASE" --stage "$PRODUCTION_STAGE" --execute --jobs 2 --output build/verification/production-ci/execution-plan.json 2>&1 | tee build/verification/production-ci/execute.log
      - uses: actions/upload-artifact@v4
        if: steps.route.outputs.ci_route == 'full_lanes'
        with:
          name: production-context-${{ github.run_id }}
          overwrite: true
          path: build/verification/production-ci/pre-execution-plan.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.route.outputs.ci_route == 'full_lanes'
        with:
          name: production-validated-foundry
          overwrite: true
          path: resources/foundry/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve plans, actual failures, per-check logs and original receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/verification/production-ci/
            build/verification/harness/
            build/verification/environment/
            build/verification/release-evidence/
            ${{ runner.temp }}/gunman-toolchains/downloads/*.attempts.jsonl
          if-no-files-found: error
          retention-days: 14
    outputs:
      ci_route: ${{ steps.route.outputs.ci_route }}
      needs_engine: ${{ steps.impact.outputs.needs_engine }}
      needs_web: ${{ steps.impact.outputs.needs_web }}
  full_checks:
    needs: prepare
    if: needs.prepare.outputs.ci_route == 'full_lanes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        lane:
          - parallel
          - serial
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/docs/evidence/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements_art.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the existing external toolchain location
        run: echo "GUNMAN_TOOLCHAIN_ROOT=$RUNNER_TEMP/gunman-toolchains" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: production-context-${{ github.run_id }}
          path: build/verification/production-ci/
      - uses: actions/download-artifact@v4
        with:
          name: production-validated-foundry
          path: resources/foundry/
      - name: Restore the exact selected prepared input closure
        run: |
          python3 - <<'PYCODE'
          import json, subprocess, sys
          from pathlib import Path
          plan=json.loads(Path('build/verification/production-ci/pre-execution-plan.json').read_text())
          manifest=json.loads(Path('tools/harness/profiles.json').read_text())
          if (plan['ci_route']!='full_lanes' or set(plan['checks'])!=set(manifest['profiles']['full'])
                  or plan['source_commit']!=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()):
              raise SystemExit('Not the same-source exact full plan')
          command=[sys.executable,'tools/cloud_inputs.py','--materialize','--output','build/verification/production-ci/lane-inputs.json']
          for check in plan['checks']: command.extend(['--check',check])
          with Path('build/verification/production-ci/lane-inputs.log').open('w') as log:
              result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
          if result.returncode: print(Path('build/verification/production-ci/lane-inputs.log').read_text())
          raise SystemExit(result.returncode)
          PYCODE
      - name: Install media dependencies required by existing docs and readers
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              if [ -f "$apt_source" ]; then sudo sed -i -E ':azure_mirror; s#(^|[[:space:]])https?://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)#\1https://archive.ubuntu.com/ubuntu\2#g; t azure_mirror' "$apt_source"; fi
            done
            sudo apt-get -o Acquire::Retries=1 update 2>&1 | tee build/verification/production-ci/media-install.log
            sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg 2>&1 | tee -a build/verification/production-ci/media-install.log
          fi
          python3 -m pip install --disable-pip-version-check --retries 1 --timeout 20 -r tools/requirements_art.txt 2>&1 | tee build/verification/production-ci/python-install.log
      - uses: actions/cache/restore@v4
        id: toolchain
        with:
          path: |
            ${{ runner.temp }}/gunman-toolchains/godot
            ${{ runner.temp }}/gunman-toolchains/user-data/godot/export_templates
          key: godot-standard-4.7.2-v2-${{ runner.os }}-${{ hashFiles('config/toolchain.json', 'tools/setup_environment.py') }}
      - name: Install and verify the repository locked Standard engine and templates
        timeout-minutes: 15
        run: |
          bash tools/cloud_setup.sh --godot-only 2>&1 | tee build/verification/production-ci/toolchain.log
          if ! command -v Xvfb >/dev/null; then
            for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              if [ -f "$apt_source" ]; then sudo sed -i -E ':azure_mirror; s#(^|[[:space:]])https?://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)#\1https://archive.ubuntu.com/ubuntu\2#g; t azure_mirror' "$apt_source"; fi
            done
            sudo apt-get -o Acquire::Retries=1 update 2>&1 | tee build/verification/production-ci/display-install.log
            sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends xvfb xauth 2>&1 | tee -a build/verification/production-ci/display-install.log
          fi
      - name: Execute one original fresh full-profile lane
        run: python3 tools/harness.py --profile full --release --jobs 1 --lane ${{ matrix.lane }}
      - name: Collect the unique original phase report and check stdout logs
        if: always()
        env:
          HARNESS_LANE: ${{ matrix.lane }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          ROOT = Path.cwd().resolve()
          def no_links(path):
              path = path if path.is_absolute() else ROOT / path
              if not path.is_relative_to(ROOT) or '..' in path.relative_to(ROOT).parts:
                  raise SystemExit('Proof path is outside repository root')
              current = ROOT
              for component in path.relative_to(ROOT).parts:
                  current = current / component
                  if current.is_symlink():
                      raise SystemExit('Proof path or repository ancestor is a symlink')
              return path
          def regular(path):
              path = no_links(path)
              if not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit('Original proof input must be a regular file')
              return path
          no_links(Path('build/verification/harness'))
          reports = list(Path('build/verification/harness').glob('*/report.json'))
          if len(reports) != 1:
              raise SystemExit('Expected exactly one original Harness phase report')
          report = regular(reports[0])
          proof = no_links(Path('build/verification/ci-lane-proof') / os.environ['HARNESS_LANE'])
          proof.mkdir(parents=True, exist_ok=False)
          shutil.copy2(report, proof / 'report.json')
          seen = set()
          for check in json.loads(report.read_text())['checks']:
              relative = Path(check['log'])
              if relative.is_absolute() or '..' in relative.parts or relative in seen or relative == Path('report.json'):
                  raise SystemExit('Invalid or repeated original check log path')
              seen.add(relative)
              source = regular(report.parent / relative)
              target = no_links(proof / relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PYCODE
      - name: Show failed Harness checks without requiring artifact download
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = sorted(Path('build/verification/harness').glob('*/report.json'))
          if reports:
              report = reports[-1]
              for check in json.loads(report.read_text()).get('checks', []):
                  if check.get('status') not in {'failed', 'timeout'}:
                      continue
                  log = (report.parent / check['log']).resolve()
                  tail = ''
                  if log.is_relative_to(report.parent.resolve()) and log.is_file():
                      tail = '\n'.join(log.read_text(errors='replace').splitlines()[-100:])
                  print('Failed check:', check['id'], check['status'])
                  print(tail)
                  detail = check['status'] + ': ' + str(check.get('failure_reason', '')) + '\n' + tail[-5000:]
                  detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Harness ' + check['id'] + '::' + detail)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-phase-proof-${{ matrix.lane }}
          overwrite: true
          path: build/verification/ci-lane-proof/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-lane-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/verification/
          if-no-files-found: error
          retention-days: 14
  affected:
    needs:
      - prepare
      - full_checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Require prepare and any selected full lanes to have succeeded
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LANES_RESULT: ${{ needs.full_checks.result }}
          CI_ROUTE: ${{ needs.prepare.outputs.ci_route }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ "$CI_ROUTE" = full_lanes ]; then
            test "$LANES_RESULT" = success
          else
            test "$CI_ROUTE" = selected_commands
            test "$LANES_RESULT" = skipped
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/docs/evidence/
          sparse-checkout-cone-mode: false
          persist-credentials: false
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements_art.txt
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - uses: actions/download-artifact@v4
        with:
          name: production-context-${{ github.run_id }}
          path: build/verification/production-ci/
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - uses: actions/download-artifact@v4
        with:
          name: production-validated-foundry
          path: resources/foundry/
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - name: Restore the exact selected prepared input closure
        run: |
          python3 - <<'PYCODE'
          import json, subprocess, sys
          from pathlib import Path
          plan=json.loads(Path('build/verification/production-ci/pre-execution-plan.json').read_text())
          manifest=json.loads(Path('tools/harness/profiles.json').read_text())
          if (plan['ci_route']!='full_lanes' or set(plan['checks'])!=set(manifest['profiles']['full'])
                  or plan['source_commit']!=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()):
              raise SystemExit('Not the same-source exact full plan')
          command=[sys.executable,'tools/cloud_inputs.py','--materialize','--output','build/verification/production-ci/lane-inputs.json']
          for check in plan['checks']: command.extend(['--check',check])
          with Path('build/verification/production-ci/lane-inputs.log').open('w') as log:
              result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
          if result.returncode: print(Path('build/verification/production-ci/lane-inputs.log').read_text())
          raise SystemExit(result.returncode)
          PYCODE
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - uses: actions/download-artifact@v4
        with:
          name: production-phase-proof-parallel
          path: build/verification/ci-lane-proof/parallel/
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - uses: actions/download-artifact@v4
        with:
          name: production-phase-proof-serial
          path: build/verification/ci-lane-proof/serial/
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - name: Verify exact same-source complete fresh check coverage and original logs
        run: |
          python3 tools/harness.py --verify-lanes build/verification/ci-lane-proof/parallel/report.json build/verification/ci-lane-proof/serial/report.json --profile full
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('build/verification/harness').glob('*/report.json'))
          if len(reports) != 1:
              raise SystemExit('Expected exactly one merged Harness report')
          report = json.loads(reports[0].read_text())
          if report.get('status') != 'passed' or report.get('partial') is not False or report.get('approval_scope') != 'selected_profiles_technical':
              raise SystemExit('Merged report did not verify complete technical coverage')
          PY
        if: needs.prepare.outputs.ci_route == 'full_lanes'
      - uses: actions/upload-artifact@v4
        if: always() && needs.prepare.outputs.ci_route == 'full_lanes'
        with:
          name: production-merged-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/verification/harness/
            build/verification/production-ci/
          if-no-files-found: warn
          retention-days: 14
