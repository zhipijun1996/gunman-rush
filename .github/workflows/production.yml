name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the former PR summary context stable for branch protection.
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GUNMAN_TOOLCHAIN_ROOT: /tmp/gunman-toolchains
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/docs/evidence/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: config/ci_python_version.txt
      - name: Project basics
        run: python3 tools/ci.py --check project
      - name: Install locked editor (no export templates)
        timeout-minutes: 2
        run: python3 tools/setup_environment.py --engine-only
      - name: Import and script validation
        run: python3 tools/ci.py --check import
      - name: Game startup smoke
        run: python3 tools/ci.py --check smoke
      - name: Core contracts
        run: python3 tools/ci.py --check contracts
