name: Deploy prepared playtest
on:
  workflow_dispatch:
    inputs:
      prepared_ref:
        description: Branch containing only the prepared Web bundle
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-playtest
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact deployment helper without historical evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-source
          sparse-checkout: tools/style_exploration_delivery.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.prepared_ref }}
          path: prepared-web
      - name: Reconstruct and verify the complete content-addressed PCK
        run: python3 delivery-source/tools/style_exploration_delivery.py reconstruct-pack --bundle prepared-web
      - name: Reconstruct the optional frozen audio comparison
        run: |
          if [ -f prepared-web/audio-before/build-info.json ]; then
            python3 delivery-source/tools/style_exploration_delivery.py reconstruct-pack --bundle prepared-web/audio-before
          fi
      - name: Reconstruct the optional FPS investigation candidate
        run: |
          if [ -f prepared-web/perf-04/build-info.json ]; then
            python3 delivery-source/tools/style_exploration_delivery.py reconstruct-pack --bundle prepared-web/perf-04
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prepared-web
      - uses: actions/deploy-pages@v4
        id: deployment
