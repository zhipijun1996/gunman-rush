name: Production opening Android review
on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: Prior successful build job to reuse for a device-only recheck
        type: string
        required: false
  push:
    branches:
      - review/plains-android-device
permissions:
  actions: read
  contents: read
jobs:
  build:
    if: ${{ !inputs.apk_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GUNMAN_TOOLCHAIN_ROOT: /tmp/gunman-android-toolchain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version-file: config/ci_python_version.txt
      - name: Build and verify signed production APK
        run: |
          bash tools/cloud_setup.sh --godot-only
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.1' 'platform-tools' 'platforms;android-35'
          python tools/export_intro_android.py build/intro-android/Plains-review.apk
          git rev-parse HEAD:production > build/intro-android/production-tree.txt
          cd build/intro-android && sha256sum Plains-review.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: opening-android-apk
          path: build/intro-android/
          retention-days: 7
  device:
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.apk_run)) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_EMULATOR_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opening-android-apk
          path: build/intro-android/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.apk_run || github.run_id }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: config/ci_python_version.txt
      - name: Prepare KVM and ADB
        run: |
          cd build/intro-android && sha256sum -c SHA256SUMS && test "$(cat production-tree.txt)" = "$(git rev-parse HEAD:production)"
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" device
          python -m pip install Pillow
          "$ANDROID_HOME/platform-tools/adb" start-server
      - name: Exercise the exact APK on Android 11
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on
          script: bash tools/run_intro_android_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-android-device
          path: build/intro-android/device/
          retention-days: 7
          if-no-files-found: warn
