name: Native ARM Android device recheck
on:
  push:
    branches:
      - review/plains-arm64-device
permissions:
  contents: read
  actions: read
jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opening-android-apk
          path: build/intro-android
          github-token: ${{ github.token }}
          run-id: 45955726890
      - uses: actions/setup-python@v5
        with:
          python-version-file: config/ci_python_version.txt
      - name: Prepare the native ARM Android host
        run: |
          set -euxo pipefail
          uname -am
          mkdir -p build/intro-android/device
          cd build/intro-android && sha256sum -c SHA256SUMS && test "$(cat production-tree.txt)" = "$(git rev-parse HEAD:production)"
          grep ANDROID_BINDER /boot/config-"$(uname -r)" || true
          sudo apt-get -qy update
          sudo apt-get -qy install adb
          python -m pip install Pillow
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get -qy install "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          stat /dev/binder || true
          sudo docker run -d --name android --privileged -p 127.0.0.1:5555:5555 redroid/redroid@sha256:3c7f9450188226bf8042c0159b9b38abe2106f1ceb0dfa45fae1cbc6409cd9bb androidboot.redroid_gpu_mode=guest androidboot.use_memfd=1 androidboot.redroid_width=540 androidboot.redroid_height=960 androidboot.redroid_dpi=240
          for tick in $(seq 1 80); do
            adb connect 127.0.0.1:5555 || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist
      - name: Exercise the unchanged game APK
        run: |
          set -eu
          serial=127.0.0.1:5555
          adb -s "$serial" shell settings put secure immersive_mode_confirmations confirmed
          adb -s "$serial" shell settings put system accelerometer_rotation 0
          adb -s "$serial" shell settings put system user_rotation 1
          adb -s "$serial" shell wm dismiss-keyguard
          adb -s "$serial" shell screenrecord --time-limit 90 --bit-rate 3000000 /data/local/tmp/intro-review.mp4 &
          trap 'adb -s "$serial" shell pkill -2 screenrecord || true; sleep 1; adb -s "$serial" pull /data/local/tmp/intro-review.mp4 build/intro-android/device/arm-touch.mp4 || true' EXIT
          python tools/test_intro_android.py build/intro-android/Plains-review.apk build/intro-android/device --serial "$serial"
      - name: Retain guest startup diagnostics
        if: always()
        run: |
          mkdir -p build/intro-android/device
          sudo docker logs android > build/intro-android/device/android-container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-android-native-arm-device
          path: build/intro-android/device/
          retention-days: 7
