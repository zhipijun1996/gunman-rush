name: Production opening Android review
on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: Prior successful build job to reuse for a device-only recheck
        type: string
        required: false
  push:
    branches:
      - review/plains-android-device
permissions:
  actions: read
  contents: read
jobs:
  device:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_EMULATOR_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opening-android-apk
          path: build/intro-android/
          github-token: ${{ github.token }}
          run-id: 45955726890
      - uses: actions/setup-python@v5
        with:
          python-version-file: config/ci_python_version.txt
      - name: Prepare KVM and ADB
        run: |
          cd build/intro-android && sha256sum -c SHA256SUMS && test "$(cat production-tree.txt)" = "$(git rev-parse HEAD:production)"
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" device
          python -m pip install Pillow
          "$ANDROID_HOME/platform-tools/adb" start-server
          Xvfb :97 -ac -screen 0 1280x720x24 +extension GLX > /tmp/xvfb.log 2>&1 &
          echo 'DISPLAY=:97' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Exercise the exact APK on Android 11
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu host -accel on -feature -Vulkan
          script: bash tools/run_intro_android_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-android-device-api${{ matrix.api }}
          path: build/intro-android/device/
          retention-days: 7
          if-no-files-found: warn
