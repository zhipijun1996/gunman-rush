name: Release and playtest

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Export target (all means Windows and Web)
        type: choice
        options: [web, windows, all, android]
        default: web
      deploy_playtest:
        description: Publish this ref's Web export to the public playtest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      build_id: ${{ steps.web_metadata.outputs.build_id }}
      source_commit: ${{ steps.web_metadata.outputs.source_commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GUNMAN_TOOLCHAIN_ROOT: /tmp/gunman-toolchains
      PLATFORM: ${{ inputs.platform }}
      DEPLOY_PLAYTEST: ${{ inputs.deploy_playtest }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/docs/evidence/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: config/ci_python_version.txt
      - name: Validate deployment target
        run: |
          if [ "$DEPLOY_PLAYTEST" = true ] && [ "$PLATFORM" != web ] && [ "$PLATFORM" != all ]; then
            echo 'Playtest deployment requires web or all.' >&2
            exit 1
          fi
      - name: Install export toolchain
        run: |
          if [ "$PLATFORM" = android ]; then
            bash tools/cloud_setup.sh --accept-android-licenses
          else
            bash tools/cloud_setup.sh --godot-only
          fi
      - name: Check and export selected platforms
        run: python3 tools/deliver.py "$PLATFORM"
      - name: Read checked Web metadata
        if: inputs.platform == 'web' || inputs.platform == 'all'
        id: web_metadata
        run: |
          python3 - <<'PY_INFO'
          import json, os
          from pathlib import Path
          info = json.loads(Path('build/web/build-info.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_id=' + info['build_id'] + '\nsource_commit=' + info['source_commit'] + '\n')
          PY_INFO
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'web' || inputs.platform == 'all'
        with:
          name: gunman-rush-web-playtest
          path: build/web/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.platform != 'web'
        with:
          name: gunman-rush-${{ inputs.platform }}
          path: |
            build/windows/
            build/android/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: inputs.deploy_playtest
        with:
          path: build/web/
  deploy_web:
    needs: build
    if: inputs.deploy_playtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-playtest
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  verify_public:
    needs: [build, deploy_web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/verify_published_build.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify public metadata and complete pack
        run: python3 tools/verify_published_build.py --url "$PUBLIC_URL" --build-id "$EXPECTED_BUILD" --commit "$EXPECTED_COMMIT"
        env:
          PUBLIC_URL: ${{ needs.deploy_web.outputs.page_url }}
          EXPECTED_BUILD: ${{ needs.build.outputs.build_id }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.source_commit }}
