name: Native release builds
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUNMAN_TOOLCHAIN_ROOT: /tmp/gunman-toolchains
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: config/ci_python_version.txt
      - name: Install locked engine and templates
        run: bash tools/cloud_setup.sh --godot-only
      - name: Check current source
        run: python3 tools/ci.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install only the native APK export tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.1" "platform-tools" "platforms;android-35"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from setup_environment import configure_editor
          configure_editor()
          PY
      - name: Export release Windows and unsigned release Android
        run: |
          python3 tools/export_native.py windows --skip-import
          python3 tools/export_native.py android --skip-import --unsigned
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 -v 4 build/android/GunmanRush-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/android/GunmanRush-unsigned.apk > build/android/package-info.txt
          if "$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree build/android/GunmanRush-unsigned.apk AndroidManifest.xml | grep -E 'android:debuggable.*0xffffffff'; then
            exit 1
          fi
      - name: Stage public signing tool without any private credentials
        run: |
          mkdir -p build/android-signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar" build/android-signing-tool/
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-builds
          path: |
            build/windows/*windows-x86_64.zip
            build/windows/build-report.json
            build/android/GunmanRush-unsigned.apk
            build/android/build-report.json
            build/android/package-info.txt
            build/android-signing-tool/apksigner.jar
          retention-days: 14
          if-no-files-found: error
  windows-startup:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: native-release-builds
          path: native
      - name: Verify actual Windows release startup
        shell: pwsh
        run: |
          $package = Get-ChildItem native/windows/*windows-x86_64.zip | Select-Object -First 1
          Expand-Archive $package.FullName -DestinationPath unpacked
          $game = Join-Path (Get-Location) 'unpacked/GunmanRush/GunmanRush.exe'
          # Exercise two seconds of real startup; unbounded headless frames can end during audio startup.
          $process = Start-Process -FilePath $game -ArgumentList '--headless','--max-fps','60','--quit-after','120' -RedirectStandardOutput 'startup.log' -RedirectStandardError 'startup-error.log' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Windows startup timed out' }
          Get-Content startup.log
          Get-Content startup-error.log
          if ($process.ExitCode -ne 0) { throw "Windows exit code $($process.ExitCode)" }
          if (Select-String -Path startup.log,startup-error.log -Pattern 'SCRIPT ERROR:|^ERROR:|Parse Error:' -Quiet) { throw 'Windows startup reported an engine error' }
      - name: Verify actual Windows display and maximize/restore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force display-check,runtime-check | Out-Null
          $game = Join-Path (Get-Location) 'unpacked/GunmanRush/GunmanRush.exe'
          $pack = Join-Path (Get-Location) 'unpacked/GunmanRush/GunmanRush.pck'
          $runtime = Join-Path (Get-Location) 'runtime-check'
          $script = Join-Path (Get-Location) 'source/tests/world/native_windows_display.gd'
          $evidence = Join-Path (Get-Location) 'display-check'
          $arguments = @('--path',$runtime,'--main-pack',$pack,'--script',$script,'--max-fps','60','--',"--evidence-dir=$evidence")
          $process = Start-Process -FilePath $game -ArgumentList $arguments -RedirectStandardOutput 'display-check/startup.log' -RedirectStandardError 'display-check/startup-error.log' -PassThru
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public class GameWindowCapture {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr window, out RECT rect);
          }
          '@
          $deadline = (Get-Date).AddSeconds(120)
          $frames = 0
          while (-not $process.WaitForExit(500)) {
            if ((Get-Date) -gt $deadline) { $process.Kill(); throw 'Windows graphical check timed out' }
            $process.Refresh()
            if ($process.MainWindowHandle -eq 0) { continue }
            $rect = New-Object GameWindowCapture+RECT
            if (-not [GameWindowCapture]::GetWindowRect($process.MainWindowHandle,[ref]$rect)) { continue }
            $desktop = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bounds = [System.Drawing.Rectangle]::FromLTRB($rect.Left,$rect.Top,$rect.Right,$rect.Bottom)
            $bounds = [System.Drawing.Rectangle]::Intersect($bounds,$desktop)
            if ($bounds.Width -lt 1 -or $bounds.Height -lt 1) { continue }
            $bitmap = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
              $bitmap.Save((Join-Path $evidence ("screen-{0:d2}.png" -f $frames)))
              $frames++
            } finally { $graphics.Dispose(); $bitmap.Dispose() }
          }
          if ($frames -eq 0) { throw 'No visible Windows client frame was captured' }
          Get-Content display-check/startup.log
          Get-Content display-check/startup-error.log
          if ($process.ExitCode -ne 0) { throw "Graphical check exit code $($process.ExitCode)" }
          if (Select-String -Path display-check/startup.log,display-check/startup-error.log -Pattern 'SCRIPT ERROR:|^ERROR:|Parse Error:|DISPLAY FAILED:' -Quiet) { throw 'Windows graphical check failed' }
          if (-not (Test-Path display-check/report.json)) { throw 'Missing real display report' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-startup
          path: |
            startup*.log
            display-check/
          retention-days: 14
