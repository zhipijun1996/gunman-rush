name: Art resource validation
on:
  push:
    paths: ['assets/**', 'tools/*art*', 'docs/*art*', '.github/workflows/art.yml']
  pull_request:
    paths: ['assets/**', 'tools/*art*', 'docs/*art*', '.github/workflows/art.yml']
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_art.py
      - run: python3 tools/check_docs.py
