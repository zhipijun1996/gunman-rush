name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/harness.py --profile docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-docs
          path: build/verification/harness/
          if-no-files-found: warn
          retention-days: 7
