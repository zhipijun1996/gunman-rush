<div id="region-lighting-study">
  <div class="region-selector"><label class="form-label" for="region-select">区域<select class="form-select" id="region-select"><!-- REGION_OPTIONS --></select></label></div>
  <div class="viz-controls" aria-label="光影对照">
    <button class="btn" type="button" data-lighting="on" aria-pressed="true">场景光照</button>
    <button class="btn" type="button" data-lighting="off" aria-pressed="false">素材原色</button>
    <button class="btn" type="button" id="region-depth" aria-pressed="true">景深层：开</button>
    <button class="btn" type="button" id="region-protection" aria-pressed="true">角色避让：开</button>
    <button class="btn" type="button" id="region-motion" aria-pressed="false">播放环境</button>
  </div>
  <div class="viz-controls" aria-label="镜头位置">
    <button class="btn" type="button" id="region-camera-left">镜头左移</button>
    <button class="btn" type="button" id="region-camera-center">镜头居中</button>
    <button class="btn" type="button" id="region-camera-right">镜头右移</button>
  </div>
  <figure><figcaption id="region-caption">区域小样</figcaption><canvas id="region-scene" width="640" height="360" role="img" aria-label="区域地形、局部光照、阴影与环境粒子">16 区域素材与景深小样</canvas></figure>
  <div id="region-loading" role="status">正在拼装区域…</div>
  <div id="region-status" class="text-small text-muted" aria-live="polite"></div>
</div>
<style>
#region-lighting-study{width:100%;color:var(--foreground)}
#region-lighting-study .region-selector{max-width:calc(100% - 100px);margin-bottom:12px}
#region-lighting-study figure{margin:14px 0 0;min-width:0}
#region-lighting-study figcaption{font-weight:500;margin-bottom:8px}
#region-lighting-study canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated}
#region-lighting-study #region-status{margin-top:10px}
#region-lighting-study #region-loading{margin-top:12px}
#region-lighting-study #region-loading[hidden]{display:none}
</style>
