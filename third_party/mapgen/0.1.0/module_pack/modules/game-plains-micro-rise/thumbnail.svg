<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="698" viewBox="-70 84 1200 698" data-content-version="sha256:b943cb54bf9a693d707ec99b2a2320c49293f2f2bd1ab36998aefa0d9e3fa959"><title>微型上升</title><metadata>{&quot;schema&quot;:&quot;gunman-rush-level-sketch/v1&quot;,&quot;id&quot;:&quot;game-plains-micro-rise&quot;,&quot;contentVersion&quot;:&quot;sha256:b943cb54bf9a693d707ec99b2a2320c49293f2f2bd1ab36998aefa0d9e3fa959&quot;}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#177e77"/></marker></defs><style>text{font:17px system-ui,sans-serif;fill:#253b37} .small{font-size:14px}</style><rect x="-70" y="84" width="1200" height="698" fill="#faf9f2"/><text x="-45" y="116" font-weight="700" font-size="24">微型上升</text><text x="-45" y="144" class="small">module · game-plains-micro-rise</text><text x="-45" y="169" class="small">sha256:b943cb54bf9a693d707ec99b2a2320c49293f2f2bd1ab36998aefa0d9e3fa959</text><text x="-45" y="196" >真实局部世界坐标 · x向右 / y向下 · 标记端口不代表可拼装 · 难度未评分</text><text x="-45" y="222" >绿=主路见证；金=奖励；蓝=回程；紫=条件锁；浅青=已观测身体扫掠（非完整净空）</text><rect x="0" y="264" width="128" height="128" data-foundation-cell="0,0" fill="#87aa96" fill-opacity=".045" stroke="#8cae9b" stroke-opacity=".35" stroke-width="1"/><rect x="0" y="392" width="128" height="128" data-foundation-cell="0,1" fill="#87aa96" fill-opacity=".045" stroke="#8cae9b" stroke-opacity=".35" stroke-width="1"/><rect x="128" y="264" width="128" height="128" data-foundation-cell="1,0" fill="#87aa96" fill-opacity=".045" stroke="#8cae9b" stroke-opacity=".35" stroke-width="1"/><rect x="128" y="392" width="128" height="128" data-foundation-cell="1,1" fill="#87aa96" fill-opacity=".045" stroke="#8cae9b" stroke-opacity=".35" stroke-width="1"/><rect x="0" y="264" width="256" height="256" data-foundation-bounds="true" fill="none" stroke="#538b98" stroke-dasharray="8 5"/><text x="-45" y="246" class="small">Foundation 1.0 · 2 × 2 Block · 完整矩形占地；虚线不是碰撞墙</text><rect x="0" y="488" width="80" height="32" fill="#607e69" fill-opacity=".85" stroke="#ffffff" stroke-width="1" transform="rotate(0 40 504)"/><rect x="176" y="360" width="80" height="32" fill="#607e69" fill-opacity=".85" stroke="#ffffff" stroke-width="1" transform="rotate(0 216 376)"/><polyline data-route-id="entry-to-exit" points="0,456 50,470 128,326 205,342 256,328" fill="none" stroke="#177e77" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline data-route-id="exit-to-entry" points="256,328 205,342 128,400 50,470 0,456" fill="none" stroke="#446db4" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><g data-port-id="entry"><circle cx="0" cy="456" r="10" fill="#fff" stroke="#1f635c" stroke-width="3"/><line x1="0" y1="456" x2="-36" y2="456" stroke="#1f635c" stroke-width="3"/><text x="12" y="430" font-weight="700">entry</text></g><g data-port-id="exit"><circle cx="256" cy="328" r="10" fill="#fff" stroke="#1f635c" stroke-width="3"/><line x1="256" y1="328" x2="292" y2="328" stroke="#1f635c" stroke-width="3"/><text x="268" y="302" font-weight="700">exit</text></g><g data-staging-port="entry"><line x1="0" y1="456" x2="24" y2="470" stroke="#538b98" stroke-dasharray="3 3"/><circle cx="24" cy="470" r="4" fill="#538b98"/><text x="29" y="488" class="small">entry staging</text></g><text x="12" y="412" class="small">LEFT · ROCK · INOUT</text><g data-staging-port="exit"><line x1="256" y1="328" x2="232" y2="342" stroke="#538b98" stroke-dasharray="3 3"/><circle cx="232" cy="342" r="4" fill="#538b98"/><text x="237" y="360" class="small">exit staging</text></g><text x="268" y="284" class="small">RIGHT · ROCK · INOUT</text><g data-corner-port="entry" data-corner="BOTTOM_LEFT" data-relocation-allowed="UNKNOWN"><title>entry · 左下换下边：未验证；Not inherited across current-source normalization; only explicit delivery configurations are allowed.</title><line x1="0" y1="456" x2="64" y2="520" stroke="#92763e" stroke-dasharray="4 4"/><circle cx="64" cy="520" r="7" fill="#faf9f2" stroke="#92763e" stroke-dasharray="3 2"/><text x="74" y="540" class="small">entry → 下 · 未验证</text></g><g data-corner-port="exit" data-corner="TOP_RIGHT" data-relocation-allowed="UNKNOWN"><title>exit · 右上换上边：未验证；Not inherited across current-source normalization; only explicit delivery configurations are allowed.</title><line x1="256" y1="328" x2="192" y2="264" stroke="#92763e" stroke-dasharray="4 4"/><circle cx="192" cy="264" r="7" fill="#faf9f2" stroke="#92763e" stroke-dasharray="3 2"/><text x="202" y="284" class="small">exit → 上 · 未验证</text></g><text x="-45" y="554" font-weight="700">有向通行（path仅指列明条件/覆盖；UNKNOWN不提供给自动拼装）</text><text x="-45" y="582" >entry → entry : UNKNOWN </text><text x="-45" y="605" >entry → exit : UNKNOWN main</text><text x="-45" y="628" >exit → entry : UNKNOWN return</text><text x="-45" y="651" >exit → exit : UNKNOWN </text><text x="-45" y="686" >奖励路线：UNKNOWN / 本候选未声明</text><text x="-45" y="712" >回程：见上方蓝色标记</text><text x="-45" y="738" >接缝、进入状态、全状态净空未验证；设计候选，不是正式地图接入证明。</text></svg>